        el('div', { class: 'empty' }, [el('p', { class: 'empty-ico', text: '🎈' }), el('p', { class: 'empty-title', text: '연습할 대사가 없어요' }), el('p', { class: 'empty-sub', text: '이 장면에는 ‘나’의 대사가 아직 없습니다. 범위를 전체 대사로 바꿔 보세요.' })])
      ]));
      return;
    }

    var turn = findTurn(sc, p.queue[p.idx]);
    root.appendChild(practiceCard(sc, p, turn));
  }

  function practiceCard(sc, p, turn) {
    var card = el('div', { class: 'panel' });

    var prev = prevTurnOf(sc, turn.id);
    if (prev) {
      var ctx = el('div', { class: 'context ' + prev.speaker }, [
        badgeFor(prev),
        el('p', { class: 'ctx-en', lang: 'en', text: prev.en }),
        el('p', { class: 'ctx-ko', text: prev.ko })
      ]);
      var b = press(el('button', { class: 'btn ghost small btn-say', type: 'button', 'aria-label': '직전 대사 듣기', text: '🔊 듣기' }), function () {
        speakOne(prev, state.speed, sc);
      });
      ctx.appendChild(el('div', { class: 'acts' }, [b]));
      card.appendChild(ctx);
    }

    var pbar = el('div', { class: 'progress-bar' });
    var progress = el('div', { class: 'progress' }, [
      el('div', { class: 'progress-track' }, [pbar]),
      el('span', { class: 'progress-num', text: (p.idx + 1) + ' / ' + p.queue.length })
    ]);
    card.appendChild(el('div', { class: 'q-tools' }, [progress]));
    pbar.style.width = Math.round((p.idx / p.queue.length) * 100) + '%';

    card.appendChild(el('p', { class: 'q-label', text: '이렇게 말해보세요' }));
    card.appendChild(el('p', { class: 'q-ko', text: turn.ko }));

    var hintPill = el('p', { class: 'hint-pill', hidden: true, text: turn.hint });
    var hintBtn = el('button', { class: 'btn ghost small btn-hint', type: 'button', 'aria-expanded': 'false', text: '힌트 보기' });
    bindHint(hintBtn, hintPill);
    card.appendChild(el('div', { class: 'q-tools' }, [hintBtn]));
    card.appendChild(hintPill);

    if (p.phase === 'input') {
      var input = el('input', {
        class: 'type-input',
        type: 'text',
        autocomplete: 'off',
        autocapitalize: 'off',
        autocorrect: 'off',
        spellcheck: 'false',
        enterkeyhint: 'done',
        placeholder: '영어로 입력 (Enter 또는 확인)',
        'aria-label': '영어 답 입력'
      });
      function check() {
        var val = input.value || '';
        if (!val.replace(/\s/g, '')) {
          toast('영어로 입력한 뒤 확인을 눌러주세요');
          return;
        }
        var ok = normalize(val) === normalize(turn.en);
        p.phase = ok ? 'right' : 'wrong';
        p.results[p.idx] = { id: turn.id, ok: ok, input: val };
        if (ok) { speakOne(turn, state.speed, sc); }
        renderPractice();
      }
      card.appendChild(input);
      var confirmBtn = press(el('button', { class: 'btn primary wide btn-check', type: 'button', text: '확인' }), check);
      card.appendChild(el('div', { class: 'q-actions' }, [confirmBtn]));
      onKey(input, 'Enter', check);
      if (input.focus) { try { input.focus(); } catch (e) { /* noop */ } }
      return card;
    }

    var result = p.results[p.idx] || { input: '' };
    if (p.phase === 'right') {
      var v = el('div', { class: 'verdict is-right', role: 'status' }, [
        el('p', { class: 'verdict-title', text: '✓ 정답이에요!' }),
        el('p', { class: 'verdict-answer', text: turn.en })
      ]);
      var replay = press(el('button', { class: 'btn small btn-say', type: 'button', text: '🔊 다시 듣기' }), function () {
        speakOne(turn, state.speed, sc);
      });
      var nextBtn = press(el('button', { class: 'btn primary btn-next', type: 'button', text: p.idx + 1 >= p.queue.length ? '결과 보기' : '다음으로 ▶' }), function () {
        practiceNext();
      });
      v.appendChild(el('div', { class: 'verdict-actions' }, [replay, nextBtn]));
      card.appendChild(v);
      return card;
    }

    var d = lcsDiff(result.input || '', turn.en);
    var mineLine = el('p', { class: 'diff-line mine' });
    for (var i = 0; i < d.mine.length; i++) {
      mineLine.appendChild(el('span', { class: d.mine[i].ok ? 'w-ok' : 'w-bad', text: d.mine[i].w }));
      mineLine.appendChild(document.createTextNode(' '));
    }
    var ansLine = el('p', { class: 'diff-line answer' });
    for (var j = 0; j < d.answer.length; j++) {
      ansLine.appendChild(el('span', { class: d.answer[j].ok ? 'w-ok' : 'w-miss', text: d.answer[j].w }));
      ansLine.appendChild(document.createTextNode(' '));
    }
    var wrong = el('div', { class: 'verdict is-wrong', role: 'status' }, [
      el('p', { class: 'verdict-title', text: '△ 조금 달라요' }),
      el('div', { class: 'diff' }, [
        el('div', {}, [el('p', { class: 'diff-label', text: '내 답' }), mineLine]),
        el('div', {}, [el('p', { class: 'diff-label', text: '정답' }), ansLine])
      ])
    ]);
    var retry = press(el('button', { class: 'btn btn-retry', type: 'button', text: '다시 입력' }), function () {
      p.phase = 'input';
      renderPractice();
    });
    var next2 = press(el('button', { class: 'btn primary btn-next', type: 'button', text: p.idx + 1 >= p.queue.length ? '결과 보기' : '다음으로 ▶' }), function () {
      practiceNext();
    });
    wrong.appendChild(el('div', { class: 'verdict-actions' }, [retry, next2]));
    card.appendChild(wrong);
    return card;
  }

  function practiceNext() {
    var p = state.practice;
    if (!p) { return; }
    if (p.idx + 1 >= p.queue.length) {
      p.done = true;
      p.phase = 'input';
      renderPractice();
      return;
    }
    p.idx += 1;
    p.phase = 'input';
    renderPractice();
  }

  function practiceSummary(sc, p) {
    var okCount = 0;
    for (var i = 0; i < p.queue.length; i++) {
      if (p.results[i] && p.results[i].ok) { okCount += 1; }
    }
    var panel = el('div', { class: 'panel' });
    panel.appendChild(el('p', { class: 'q-label', text: '연습 결과' }));
    panel.appendChild(el('div', { class: 'summary-score' }, [
      el('b', { text: okCount + ' / ' + p.queue.length }),
      el('span', { text: okCount === p.queue.length ? '모두 맞혔어요 🎉' : '한 번 더 소리 내어 읽어보세요' })
    ]));
    var list = el('div', { class: 'summary-list' });
    for (var j = 0; j < p.queue.length; j++) {
      var t = findTurn(sc, p.queue[j]);
      var r = p.results[j];
      list.appendChild(el('div', { class: 'summary-item' }, [
        el('span', { class: 'mark ' + (r && r.ok ? 'o' : 'x'), text: r && r.ok ? 'O' : 'X' }),
        el('div', {}, [
          el('p', { text: t.ko }),
          el('p', { class: 's-en', text: t.en })
        ])
      ]));
    }
    panel.appendChild(list);
    var again = press(el('button', { class: 'btn primary wide btn-again', type: 'button', text: '같은 순서로 다시 풀기' }), function () {
      startPractice(sc); renderPractice();
    });
    var flipOrder = press(el('button', { class: 'btn wide btn-shuffle', type: 'button', text: state.practiceOrder === 'rand' ? '순차로 풀기' : '랜덤으로 풀기' }), function () {
      state.practiceOrder = state.practiceOrder === 'rand' ? 'seq' : 'rand';
      saveUI();
      startPractice(sc); renderPractice();
    });
    panel.appendChild(el('div', { class: 'q-actions' }, [again]));
    panel.appendChild(el('div', { class: 'q-actions' }, [flipOrder]));
    return panel;
  }

  /* ════════════════════════════════════════════════════
     10. 누적 Quiz 탭 — 간격 반복
     ════════════════════════════════════════════════════ */
  function todayDue() {
    var today = todayISO();
    var out = [];
    for (var s = 0; s < CONTENT.scenes.length; s++) {
      var sc = CONTENT.scenes[s];
      var lr = learnedOf(sc.id);
      if (!lr || !lr.date) { continue; }
      var elapsed = daysBetween(lr.date, today);
      if (elapsed < 0) { continue; }
      for (var d = 0; d < INTERVALS.length; d++) {
        var day = INTERVALS[d];
        if (elapsed < day) { continue; }
        var key = 'D' + day;
        for (var t = 0; t < sc.turns.length; t++) {
          var turn = sc.turns[t];
          if (!getHist(sc.id, turn.id, key)) {
            out.push({ sceneId: sc.id, turnId: turn.id, dayKey: key, overdue: elapsed > day, dueDate: addDays(lr.date, day) });
          }
        }
      }
    }
    out.sort(function (a, b) {
      if (DAY_NUM[a.dayKey] !== DAY_NUM[b.dayKey]) { return DAY_NUM[a.dayKey] - DAY_NUM[b.dayKey]; }
      if (a.sceneId !== b.sceneId) { return a.sceneId < b.sceneId ? -1 : 1; }
      return turnIndex(findScene(a.sceneId), a.turnId) - turnIndex(findScene(b.sceneId), b.turnId);
    });
    return out;
  }

  function startQuiz(mode) {
    var items = [];
    if (mode === 'practice') {
      var sc = currentScene();
      for (var i = 0; i < sc.turns.length; i++) {
        items.push({ sceneId: sc.id, turnId: sc.turns[i].id, dayKey: 'D1', practice: true });
      }
      toast('D+1 예습 Quiz를 시작해요', '결과는 성적표의 D1 칸에 기록됩니다.');
    } else {
      items = todayDue();
      if (!items.length) {
        toast('오늘 도래한 복습이 없어요', '아래의 예습 Quiz로 미리 연습할 수 있어요.');
        return;
      }
    }
    state.quiz = { mode: mode, items: items, idx: 0, phase: 'run', results: [] };
    renderQuiz();
  }

  function renderQuiz() {
    var root = refs.quiz;
    if (!root) { return; }
    if (state.quiz && (state.quiz.phase === 'run' || state.quiz.phase === 'feedback')) { renderQuizRun(); updateBadge(); return; }
    if (state.quiz && state.quiz.phase === 'done') { renderQuizDone(); updateBadge(); return; }
    clear(root);
    renderQuizHome(root);
    updateBadge();
  }

  function scheduleCard(sc) {
    var lr = learnedOf(sc.id);
    var panel = el('div', { class: 'panel' });
    panel.appendChild(el('p', { class: 'panel-title', text: '복습 일정 · ' + sc.chip }));
    if (!lr) {
      panel.appendChild(el('p', { class: 'view-sub', text: '학습 완료를 기록하면 일정이 시작됩니다.' }));
      return panel;
    }
    var today = todayISO();
    var grid = el('div', { class: 'sched' });
    for (var i = 0; i < INTERVALS.length; i++) {
      var d = INTERVALS[i];
      var key = 'D' + d;
      var date = addDays(lr.date, d);
      var answered = 0;
      for (var t = 0; t < sc.turns.length; t++) { if (getHist(sc.id, sc.turns[t].id, key)) { answered += 1; } }
      var total = sc.turns.length;
      var cls = 'sched-cell';
      var note;
      if (answered >= total) { cls += ' is-done'; note = '완료'; }
      else if (date <= today) { cls += ' is-due'; note = '도래 · ' + answered + '/' + total; }
      else { note = '예정'; }
      grid.appendChild(el('div', { class: cls, 'data-day': key }, [
        el('b', { text: key }),
        el('span', { text: shortDate(date) + ' · ' + note })
      ]));
    }
    panel.appendChild(grid);
    var elapsed = daysBetween(lr.date, today);
    panel.appendChild(el('p', { class: 'view-sub', text: '학습 시작 ' + fmtDate(lr.date) + ' · 오늘 D+' + (elapsed > 0 ? elapsed : 0) }));
    return panel;
  }

  function renderQuizHome(root) {
    var sc = currentScene();
    root.appendChild(el('div', { class: 'view-head' }, [
      el('h1', { class: 'view-title', text: '🧠 누적 Quiz' }),
      el('p', { class: 'view-sub', text: '에빙하우스 간격 반복 · D+1 · D+2 · D+5 · D+7 · D+14 · D+30' })
    ]));
    root.appendChild(scheduleCard(sc));

    var due = todayDue();
    if (due.length) {
      var byDay = {};
      for (var i = 0; i < due.length; i++) {
        byDay[due[i].dayKey] = (byDay[due[i].dayKey] || 0) + 1;
      }
      var dayLine = [];
      for (var k = 0; k < DAY_KEYS.length; k++) {
        if (byDay[DAY_KEYS[k]]) { dayLine.push(DAY_KEYS[k] + ' ' + byDay[DAY_KEYS[k]] + '문항'); }
      }
      var panel = el('div', { class: 'panel' });
      panel.appendChild(el('p', { class: 'q-label', text: '오늘 도래한 복습' }));
      panel.appendChild(el('p', { class: 'q-ko', text: due.length + '문항' }));
      panel.appendChild(el('p', { class: 'view-sub', text: dayLine.join(' · ') }));
      panel.appendChild(el('div', { class: 'q-actions' }, [
        press(el('button', { class: 'btn primary wide btn-start-due', type: 'button', text: '복습 시작 ▶' }), function () { startQuiz('due'); })
      ]));
      root.appendChild(panel);
    } else {
      var lr = learnedOf(sc.id);
      var nx = nextReview(sc);
      var emptyPanel = el('div', { class: 'panel' }, [
        el('div', { class: 'empty' }, [
          el('p', { class: 'empty-ico', text: '🌤' }),
          el('p', { class: 'empty-title', text: '오늘 도래한 복습이 없어요' }),
          el('p', { class: 'empty-sub', text: nx ? '다음 복습은 ' + nx.dayKey + ' · ' + fmtDate(nx.date) + ' 이에요.' : (lr ? '모든 간격을 마쳤어요.' : '먼저 학습 탭에서 오늘 학습 완료를 눌러주세요.') })
        ])
      ]);
      root.appendChild(emptyPanel);
    }

    var practicePanel = el('div', { class: 'panel soft' });
    practicePanel.appendChild(el('p', { class: 'panel-title', text: '바로 연습하고 싶다면' }));
    practicePanel.appendChild(el('p', { class: 'view-sub', text: '일차가 되지 않아도 지금 시험 삼아 풀어볼 수 있어요. 결과는 성적표의 D1 칸에 기록됩니다.' }));
    practicePanel.appendChild(el('div', { class: 'q-actions' }, [
      press(el('button', { class: 'btn wide btn-start-practice', type: 'button', text: '지금 바로 연습 Quiz 풀기 (D+1 예습/테스트)' }), function () { startQuiz('practice'); })
    ]));
    root.appendChild(practicePanel);

    var allScenes = el('div', { class: 'panel soft' });
    allScenes.appendChild(el('p', { class: 'panel-title', text: '전체 장면 진도' }));
    for (var s = 0; s < CONTENT.scenes.length; s++) {
      var item = CONTENT.scenes[s];
      var lr2 = learnedOf(item.id);
      var done = 0, totalCells = item.turns.length * INTERVALS.length;
      for (var t2 = 0; t2 < item.turns.length; t2++) {
        for (var d2 = 0; d2 < DAY_KEYS.length; d2++) {
          if (getHist(item.id, item.turns[t2].id, DAY_KEYS[d2])) { done += 1; }
        }
      }
      allScenes.appendChild(el('p', { class: 'view-sub', text: item.chip + ' · ' + (lr2 ? 'D+' + Math.max(0, daysBetween(lr2.date, todayISO())) : '학습 전') + ' · 성적 ' + done + '/' + totalCells }));
    }
    root.appendChild(allScenes);
  }

  function renderQuizRun() {
    var root = refs.quiz;
    var q = state.quiz;
    var item = q.items[q.idx];
    var sc = findScene(item.sceneId);
    var turn = findTurn(sc, item.turnId);
    clear(root);

    var head = el('div', { class: 'view-head' }, [
      el('h1', { class: 'view-title', text: (item.practice ? 'D+1 예습 Quiz' : item.dayKey + ' 복습 Quiz') }),
      el('p', { class: 'view-sub', text: sc.chip + (item.practice ? ' · 예습' : '') })
    ]);
    root.appendChild(head);

    var qbar = el('div', { class: 'progress-bar' });
    var bar = el('div', { class: 'progress' }, [
      el('div', { class: 'progress-track' }, [qbar]),
      el('span', { class: 'progress-num', text: (q.idx + 1) + ' / ' + q.items.length })
    ]);
    root.appendChild(el('div', { class: 'panel soft' }, [bar]));
    qbar.style.width = Math.round((q.idx / q.items.length) * 100) + '%';

    var card = el('div', { class: 'panel' });
    card.appendChild(el('div', { class: 'turn-head' }, [
      badgeFor(turn),
      el('span', { class: 'view-sub', text: turn.speaker === 'me' ? '내가 할 말을 영어로' : '직원이 한 말을 영어로' })
    ]));
    card.appendChild(el('p', { class: 'q-ko', text: turn.ko }));

    var hintPill = el('p', { class: 'hint-pill', hidden: true, text: turn.hint });
    var hintBtn = el('button', { class: 'btn ghost small btn-hint', type: 'button', 'aria-expanded': 'false', text: '힌트 보기' });
    bindHint(hintBtn, hintPill);
    card.appendChild(el('div', { class: 'q-tools' }, [hintBtn]));
    card.appendChild(hintPill);
    root.appendChild(card);

    if (q.phase === 'run') {
      var input = el('input', {
        class: 'type-input',
        type: 'text',
        autocomplete: 'off',
        autocapitalize: 'off',
        autocorrect: 'off',
        spellcheck: 'false',
        enterkeyhint: 'done',
        placeholder: '영어로 입력 (Enter 또는 확인)',
        'aria-label': '영어 답 입력'
      });
      function judge() {
        var val = input.value || '';
        if (!val.replace(/\s/g, '')) {
          toast('영어로 입력한 뒤 확인을 눌러주세요');
          return;
        }
        var ok = normalize(val) === normalize(turn.en);
        setHist(item.sceneId, item.turnId, item.dayKey, ok ? 'O' : 'X');
        q.results[q.idx] = { ok: ok, input: val };
        q.phase = 'feedback';
        q.lastOk = ok;
        if (ok) { speakOne(turn, state.speed, sc); }
        updateBadge();
        renderQuiz();
      }
      card.appendChild(input);
      card.appendChild(el('div', { class: 'q-actions' }, [press(el('button', { class: 'btn primary wide btn-check', type: 'button', text: '제출하고 채점' }), judge)]));
      onKey(input, 'Enter', judge);
      if (input.focus) { try { input.focus(); } catch (e) { /* noop */ } }
      return;
    }

    var result = q.results[q.idx] || { input: '' };
    var isRight = !!q.lastOk;
    var box;
    if (isRight) {
      box = el('div', { class: 'verdict is-right', role: 'status' }, [
        el('p', { class: 'verdict-title', text: '⭕ 정답 (O)' }),
        el('p', { class: 'verdict-answer', text: turn.en })
      ]);
      box.appendChild(el('div', { class: 'verdict-actions' }, [
        press(el('button', { class: 'btn small btn-say', type: 'button', text: '🔊 다시 듣기' }), function () { speakOne(turn, state.speed, sc); }),
        press(el('button', { class: 'btn primary btn-next', type: 'button', text: q.idx + 1 >= q.items.length ? '성적 보기' : '다음 문항 ▶' }), function () { quizNext(); })
      ]));
    } else {
      var d = lcsDiff(result.input || '', turn.en);
      var mine = el('p', { class: 'diff-line mine' });
      for (var i = 0; i < d.mine.length; i++) {
        mine.appendChild(el('span', { class: d.mine[i].ok ? 'w-ok' : 'w-bad', text: d.mine[i].w }));
        mine.appendChild(document.createTextNode(' '));
      }
      var ans = el('p', { class: 'diff-line answer' });
      for (var j = 0; j < d.answer.length; j++) {
        ans.appendChild(el('span', { class: d.answer[j].ok ? 'w-ok' : 'w-miss', text: d.answer[j].w }));
        ans.appendChild(document.createTextNode(' '));
      }
      box = el('div', { class: 'verdict is-wrong', role: 'status' }, [
        el('p', { class: 'verdict-title', text: '❌ 오답 (X)' }),
        el('div', { class: 'diff' }, [
          el('div', {}, [el('p', { class: 'diff-label', text: '내 답' }), mine]),
          el('div', {}, [el('p', { class: 'diff-label', text: '정답' }), ans])
        ])
      ]);
      box.appendChild(el('div', { class: 'verdict-actions' }, [
        press(el('button', { class: 'btn small btn-say', type: 'button', text: '🔊 정답 듣기' }), function () { speakOne(turn, state.speed, sc); }),
        press(el('button', { class: 'btn primary btn-next', type: 'button', text: q.idx + 1 >= q.items.length ? '성적 보기' : '다음 문항 ▶' }), function () { quizNext(); })
      ]));
    }
    root.appendChild(box);
  }

  function quizNext() {
    var q = state.quiz;
    if (!q) { return; }
    if (q.idx + 1 >= q.items.length) { q.phase = 'done'; renderQuiz(); return; }
    q.idx += 1;
    q.phase = 'run';
    renderQuiz();
  }

  function renderQuizDone() {
    var root = refs.quiz;
    var q = state.quiz;
    clear(root);
    var okCount = 0;
    for (var i = 0; i < q.items.length; i++) { if (q.results[i] && q.results[i].ok) { okCount += 1; } }

    root.appendChild(el('div', { class: 'view-head' }, [
      el('h1', { class: 'view-title', text: q.mode === 'practice' ? '예습 Quiz 결과' : '복습 Quiz 결과' }),
      el('p', { class: 'view-sub', text: '결과가 성적표에 저장됐습니다.' })
    ]));

    var panel = el('div', { class: 'panel' });
    panel.appendChild(el('div', { class: 'summary-score' }, [
      el('b', { text: okCount + ' / ' + q.items.length }),
      el('span', { text: okCount === q.items.length ? '완벽해요 🎉' : '틀린 문장은 성적표에서 다시 확인하세요' })
    ]));
    var list = el('div', { class: 'summary-list' });
    for (var j = 0; j < q.items.length; j++) {
      var item = q.items[j];
      var sc = findScene(item.sceneId);
      var turn = findTurn(sc, item.turnId);
      var r = q.results[j];
      list.appendChild(el('div', { class: 'summary-item' }, [
        el('span', { class: 'mark ' + (r && r.ok ? 'o' : 'x'), text: r && r.ok ? 'O' : 'X' }),
        el('div', {}, [
          el('p', { text: turn.ko }),
          el('p', { class: 's-en', text: turn.en + ' · ' + item.dayKey })
        ])
      ]));
    }
    panel.appendChild(list);
    root.appendChild(panel);

    var home = press(el('button', { class: 'btn primary wide', type: 'button', text: 'Quiz 홈으로' }), function () {
      state.quiz = null;
      renderQuiz();
    });
    root.appendChild(el('div', { class: 'q-actions' }, [home]));
    if (q.mode === 'practice') {
      var again = press(el('button', { class: 'btn wide', type: 'button', text: '예습 Quiz 한 번 더' }), function () {
        startQuiz('practice');
      });
      root.appendChild(el('div', { class: 'q-actions' }, [again]));
    }
    var toScores = press(el('button', { class: 'btn wide', type: 'button', text: '📊 성적표 보기' }), function () {
      switchTab('scores');
    });
    root.appendChild(el('div', { class: 'q-actions' }, [toScores]));
  }

  /* ════════════════════════════════════════════════════
     11. 성적표 탭
     ════════════════════════════════════════════════════ */
  function renderScores() {
    var root = refs.scores;
    if (!root) { return; }
    clear(root);
    var sc = currentScene();

    root.appendChild(el('div', { class: 'view-head' }, [
      el('h1', { class: 'view-title', text: '📊 성적표' }),
      el('p', { class: 'view-sub', text: '표현별 D+1 · D+2 · D+5 · D+7 · D+14 · D+30 결과' })
    ]));

    var chips = el('div', { class: 'chips', 'aria-label': '장면 선택' });
    for (var s = 0; s < CONTENT.scenes.length; s++) {
      (function (item, index) {
        var on = item.id === sc.id;
        var parts = String(item.chip || '').split(' · ');
        var b = el('button', { class: 'chip' + (on ? ' is-on' : ''), type: 'button', 'aria-pressed': on ? 'true' : 'false', 'data-scene': item.id }, [
          el('span', { class: 'chip-kicker', text: parts.length > 1 ? parts[0] : item.chapter }),
          el('span', { class: 'chip-label', text: parts.length > 1 ? parts.slice(1).join(' · ') : item.chip })
        ]);
        press(b, function () { if (!on) { selectScene(item.id); renderScores(); } });
        chips.appendChild(b);
      })(CONTENT.scenes[s], s);
    }
    root.appendChild(chips);

    var lr = learnedOf(sc.id);
    var totalCells = sc.turns.length * DAY_KEYS.length;
    var answered = 0, correct = 0;
    for (var t = 0; t < sc.turns.length; t++) {
      for (var d = 0; d < DAY_KEYS.length; d++) {
        var v = getHist(sc.id, sc.turns[t].id, DAY_KEYS[d]);
        if (v) { answered += 1; if (v === 'O') { correct += 1; } }
      }
    }
    var rate = answered ? Math.round((correct / answered) * 100) : 0;

    var summary = el('div', { class: 'panel' });
    summary.appendChild(el('div', { class: 'turn-head' }, [
      el('span', { class: 'badge', text: '진도' }),
      el('span', { class: 'view-sub', text: (lr ? '학습 시작 ' + fmtDate(lr.date) : '학습 전') + ' · ' + (lr && lr.confirmed ? '학습 완료 기록됨' : '학습 완료 전') })
    ]));
    summary.appendChild(el('div', { class: 'stat-grid' }, [
      el('div', { class: 'stat' }, [el('b', { text: String(answered) }), el('span', { text: '응시 ' + totalCells + '칸 중' })]),
      el('div', { class: 'stat' }, [el('b', { text: String(correct) }), el('span', { text: '정답' })]),
      el('div', { class: 'stat' }, [el('b', { text: rate + '%' }), el('span', { text: '정답률' })])
    ]));
    var rateBar = el('div', { class: 'progress-bar' });
    var bar = el('div', { class: 'progress-track' }, [rateBar]);
    summary.appendChild(bar);
    rateBar.style.width = rate + '%';
    root.appendChild(summary);

    for (var i = 0; i < sc.turns.length; i++) {
      var turn = sc.turns[i];
      var row = el('article', { class: 'score-row', 'data-turn': turn.id });
      row.appendChild(el('div', { class: 'score-top' }, [badgeFor(turn), el('span', { class: 'turn-no', text: (i + 1) + '.' })]));
      row.appendChild(el('p', { class: 'score-ko', text: turn.ko }));
      row.appendChild(el('p', { class: 'score-en', text: turn.en }));
      row.appendChild(el('p', { class: 'hint-pill', text: turn.hint }));
      var badges = el('div', { class: 'badges' });
      for (var k = 0; k < DAY_KEYS.length; k++) {
        var key = DAY_KEYS[k];
        var hv = getHist(sc.id, turn.id, key);
        var cls = 'dbadge' + (hv === 'O' ? ' is-o' : (hv === 'X' ? ' is-x' : ' is-none'));
        var label = hv === 'O' ? '정답' : (hv === 'X' ? '오답' : '미응시');
        var badge = el('span', { class: cls, 'aria-label': key + ' ' + label }, [
          el('b', { text: key }),
          el('span', { text: hv || '-' })
        ]);
        badges.appendChild(badge);
      }
      row.appendChild(badges);
      root.appendChild(row);
    }

    var details = el('details', { class: 'details' });
    details.appendChild(el('summary', { text: '성적 초기화 · 학습 기록 관리' }));
    var body = el('div', { class: 'details-body' });
    body.appendChild(press(el('button', { class: 'btn small danger btn-reset-scene', type: 'button', text: '이 장면 Quiz 성적 초기화' }), function () {
      var ok = !window.confirm || window.confirm('‘' + sc.chip + '’의 Quiz 성적을 모두 지울까요? 되돌릴 수 없습니다.');
      if (!ok) { return; }
      store.quiz[sc.id] = {};
      saveStore();
      renderScores();
      updateBadge();
      toast('이 장면의 Quiz 성적을 초기화했어요');
    }));
    body.appendChild(press(el('button', { class: 'btn small danger btn-reset-all', type: 'button', text: '전체 Quiz 성적 초기화' }), function () {
      var ok = !window.confirm || window.confirm('모든 장면의 Quiz 성적을 지울까요? 되돌릴 수 없습니다.');
      if (!ok) { return; }
      store.quiz = {};
      saveStore();
      renderScores();
      updateBadge();
      toast('전체 Quiz 성적을 초기화했어요');
    }));
    body.appendChild(press(el('button', { class: 'btn small btn-reset-learned', type: 'button', text: '학습 시작일을 오늘로 다시 잡기' }), function () {
      var ok = !window.confirm || window.confirm('복습 일정을 오늘(' + fmtDate(todayISO()) + ')로 다시 잡을까요? Quiz 성적은 그대로 남습니다.');
      if (!ok) { return; }
      setLearned(sc.id, todayISO(), false);
      renderScores();
      renderStudy();
      updateBadge();
      toast('학습 시작일을 오늘로 다시 잡았어요');
    }));
    details.appendChild(body);
    root.appendChild(el('div', { class: 'reset-zone' }, [details]));
  }

  /* ════════════════════════════════════════════════════
     12. 탭 전환
     ════════════════════════════════════════════════════ */
  var VIEWS = { study: 'study', practice: 'practice', quiz: 'quiz', scores: 'scores' };
  var TAB_REF = { study: 'tabStudy', practice: 'tabPractice', quiz: 'tabQuiz', scores: 'tabScores' };
  var VIEW_REF = { study: 'viewStudy', practice: 'viewPractice', quiz: 'viewQuiz', scores: 'viewScores' };

  function switchTab(tab, silent) {
    if (!VIEWS[tab]) { return; }
    state.tab = tab;
    for (var i = 0; i < TABS.length; i++) {
      var key = TABS[i];
      var btn = refs[TAB_REF[key]];
      var view = refs[VIEW_REF[key]];
      var on = key === tab;
      if (btn) {
        btn.classList.toggle('is-on', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      }
      if (view) { view.hidden = !on; }
    }
    if (tab === 'study') { renderStudy(); }
    else if (tab === 'practice') { renderPractice(); }
    else if (tab === 'quiz') { renderQuiz(); }
    else if (tab === 'scores') { renderScores(); }
    if (!silent) { saveUI(); }
    updateBadge();
    if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (e) { /* noop */ } }
  }

  function updateBadge() {
    if (!refs.quizBadge) { return; }
    var n = todayDue().length;
    if (n > 0) {
      refs.quizBadge.textContent = String(n);
      refs.quizBadge.hidden = false;
    } else {
      refs.quizBadge.hidden = true;
    }
  }

  function bindTabs() {
    for (var i = 0; i < TABS.length; i++) {
      (function (key) {
        var btn = refs[TAB_REF[key]];
        if (!btn) { return; }
        btn.addEventListener('click', function (ev) {
          if (ev && ev.preventDefault) { ev.preventDefault(); }
          switchTab(key);
        });
      })(TABS[i]);
    }
  }

  function bindTheme() {
    if (refs.themeBtn) {
      refs.themeBtn.addEventListener('click', function (ev) {
        if (ev && ev.preventDefault) { ev.preventDefault(); }
        cycleTheme();
      });
    }
  }

  /* ════════════════════════════════════════════════════
     13. PWA — 홈 화면에 추가
     ════════════════════════════════════════════════════ */
  var ICON_SVG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2NCA2NCc+PHJlY3Qgd2lkdGg9JzY0JyBoZWlnaHQ9JzY0JyByeD0nMTUnIGZpbGw9JyMyNTYzZWInLz48cGF0aCBkPSdNMTQgMjJoMTV2NUgyMnY1aDZ2NWgtNnY1aC04eicgZmlsbD0nI2ZmZmZmZicvPjxwYXRoIGQ9J00zNSA0MlYyMmg2bDYgMTEgNi0xMWg2djIwaC02VjMybC02IDEwLTYtMTB2MTB6JyBmaWxsPScjZGJlYWZlJy8+PC9zdmc+";

  function makeIconPNG(size) {
    try {
      var c = document.createElement('canvas');
      if (!c || !c.getContext) { return null; }
      c.width = size;
      c.height = size;
      var ctx = c.getContext('2d');
      if (!ctx) { return null; }
      var r = size * 0.23;
      ctx.fillStyle = '#2563eb';
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(0, 0, size, size, r);
        ctx.fill();
      } else {
        ctx.fillRect(0, 0, size, size);
      }
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 ' + Math.round(size * 0.42) + 'px system-ui, -apple-system, sans-serif';
      ctx.fillText('EN', size / 2, size * 0.53);
      return c.toDataURL('image/png');
    } catch (e) {
      return null;
    }
  }

  function installPWA() {
    var head = document.head;
    if (!head || !document.createElement) { return; }
    /* 동적 Web App Manifest */
    try {
      if (window.Blob && window.URL && window.URL.createObjectURL) {
        var icons = [{ src: ICON_SVG, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }];
        var png512 = makeIconPNG(512);
        var png192 = makeIconPNG(192);
        if (png192) { icons.push({ src: png192, sizes: '192x192', type: 'image/png', purpose: 'any' }); }
        if (png512) { icons.push({ src: png512, sizes: '512x512', type: 'image/png', purpose: 'any' }); }
        var manifest = {
          name: '하늘영어',
          short_name: '하늘영어',
          description: '한국어 카드를 뒤집어 영어로 말하고, 타이핑으로 연습하고, 간격 반복으로 복습하는 영어 회화 카드',
          lang: 'ko',
          dir: 'ltr',
          start_url: String(window.location ? window.location.href : '').split('#')[0],
          scope: String(window.location ? window.location.href : '').split('#')[0],
          display: 'standalone',
          orientation: 'portrait',
          background_color: resolveTheme() === 'dark' ? '#0a0d14' : '#eef1f7',
          theme_color: '#2f6bff',
          icons: icons
        };
        var blob = new window.Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        var link = document.createElement('link');
        link.setAttribute('rel', 'manifest');
        link.setAttribute('href', window.URL.createObjectURL(blob));
        head.appendChild(link);
        refs.manifestLink = link;
      }
    } catch (e) { /* manifest 미지원 환경 */ }
    /* iOS 홈 화면 아이콘 (PNG 우선) */
    try {
      var touch = makeIconPNG(180);
      if (touch) {
        var icon = document.createElement('link');
        icon.setAttribute('rel', 'apple-touch-icon');
        icon.setAttribute('sizes', '180x180');
        icon.setAttribute('href', touch);
        head.appendChild(icon);
      }
    } catch (e2) { /* noop */ }
  }

  /* ════════════════════════════════════════════════════
     14. 부팅
     ════════════════════════════════════════════════════ */
  function grabRefs() {
    var ids = ['app', 'brandSub', 'themeBtn', 'themeIcon', 'themeColor', 'main', 'view-study', 'view-practice', 'view-quiz', 'view-scores', 'tab-study', 'tab-practice', 'tab-quiz', 'tab-scores', 'quizBadge', 'toast', 'toastMsg', 'toastSub'];
    for (var i = 0; i < ids.length; i++) {
      var key = ids[i];
      var camel = key.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); });
      refs[camel] = document.getElementById(key);
    }
    refs.study = refs.viewStudy;
    refs.practice = refs.viewPractice;
    refs.quiz = refs.viewQuiz;
    refs.scores = refs.viewScores;
  }

  /* 가장 최근에 배운 장면 = learnedDate 가 가장 늦은 장면.
     CONTENT.scenes 는 최신 장면이 앞에 오도록 두고, 앱을 열면 항상 최신 장면이 뜬다. */
  function latestScene() {
    var best = CONTENT.scenes[0];
    for (var i = 1; i < CONTENT.scenes.length; i++) {
      if (String(CONTENT.scenes[i].learnedDate || '') > String(best.learnedDate || '')) {
        best = CONTENT.scenes[i];
      }
    }
    return best;
  }

  function restoreUI() {
    var ui = (store && store.ui) || {};
    if (ui.sceneId && findScene(ui.sceneId)) { state.sceneId = ui.sceneId; }
    /* 새 장면이 추가되면 저장된 옛 선택보다 최신 장면을 우선한다 */
    var latest = latestScene();
    var cur = findScene(state.sceneId);
    if (latest && (!cur || String(latest.learnedDate || '') > String(cur.learnedDate || ''))) {
      state.sceneId = latest.id;
    }
    if (ui.lang && langDef(ui.lang).code === ui.lang) { state.lang = ui.lang; }
    if (ui.theme === 'auto' || ui.theme === 'light' || ui.theme === 'dark') { state.theme = ui.theme; }
    if (typeof ui.speed === 'number' && ui.speed > 0) { state.speed = ui.speed; }
    if (ui.koEn === true) { state.koEn = true; }
    if (ui.practiceScope === 'all' || ui.practiceScope === 'me') { state.practiceScope = ui.practiceScope; }
    if (ui.practiceOrder === 'rand' || ui.practiceOrder === 'seq') { state.practiceOrder = ui.practiceOrder; }
    if (ui.tab && VIEWS[ui.tab]) { state.tab = ui.tab; }
  }

  function init() {
    grabRefs();
    bootStore();
    restoreUI();
    applyTheme();
    bindTabs();
    bindTheme();
    installPWA();
    /* 기기 음성 폴백용 — 음성 목록은 호출 때마다 getVoices() 로 읽는다 */
    if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
      try { window.speechSynthesis.addEventListener('voiceschanged', function () { /* 목록은 매번 새로 읽음 */ }); } catch (e) { /* noop */ }
    }
    switchTab(state.tab, true);
  }

  init();
})();
</script>
