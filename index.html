      var raw = window.localStorage.getItem('esd.deck.v1');
      var data = raw ? JSON.parse(raw) : null;
      var choice = (data && data.ui && data.ui.theme) || 'auto';
      var dark = choice === 'dark' || (choice === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<style>
  :root {
    --bg: #eef1f7;
    --surface: #ffffff;
    --surface-2: #f4f6fb;
    --text: #101623;
    --muted: #67718a;
    --line: #e2e7f2;
    --brand: #2f6bff;
    --brand-ink: #1d4ed8;
    --brand-soft: #e8efff;
    --ok: #0e9f6e;
    --ok-soft: #e3f8ef;
    --bad: #e02424;
    --bad-soft: #fdecec;
    --badge-p-bg: #efe9ff;
    --badge-p-fg: #6b3fd4;
    --badge-m-bg: #dcf7ef;
    --badge-m-fg: #087f66;
    --me-row: #effcf8;
    --hint-bg: #fff8e6;
    --hint-fg: #8a5a00;
    --hint-line: #f0d9a8;
    --toast-bg: #101623;
    --toast-fg: #ffffff;
    --nav-bg: rgba(255, 255, 255, 0.9);
    --shadow: 0 12px 34px rgba(16, 22, 35, 0.09);
    --shadow-sm: 0 2px 8px rgba(16, 22, 35, 0.06);
    --radius: 20px;
    /* 카드 앞면(Kor) / 뒷면(Eng) 바탕 구분 */
    --face-kor-bg: #fffdf7;
    --face-kor-line: #eee4d0;
    --face-eng-bg: #eef3ff;
    --face-eng-line: #c7d7fe;
    --face-eng-row: #ffffff;
    --side-btn-1: #2f6bff;
    --side-btn-2: #1d4ed8;
    --side-btn-ink: #ffffff;
    --side-btn-shadow: 0 6px 18px rgba(47, 107, 255, 0.32);
  }
  :root[data-theme="dark"] {
    --bg: #0a0d14;
    --surface: #131a26;
    --surface-2: #1a2433;
    --text: #e9eefb;
    --muted: #94a1bb;
    --line: #24303f;
    --brand: #5b8cff;
    --brand-ink: #c0d4ff;
    --brand-soft: #16233c;
    --ok: #3ddc97;
    --ok-soft: #10352a;
    --bad: #ff7070;
    --bad-soft: #3a1c1f;
    --badge-p-bg: #2a2050;
    --badge-p-fg: #c9b6ff;
    --badge-m-bg: #0f3b31;
    --badge-m-fg: #6fe7c2;
    --me-row: #122a26;
    --hint-bg: #33270d;
    --hint-fg: #ffd68a;
    --hint-line: #5a4415;
    --toast-bg: #e9eefb;
    --toast-fg: #101623;
    --nav-bg: rgba(19, 26, 38, 0.9);
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    /* 카드 앞면(Kor) / 뒷면(Eng) 바탕 구분 — 다크 */
    --face-kor-bg: #161b26;
    --face-kor-line: #2b3547;
    --face-eng-bg: #1b2438;
    --face-eng-line: #38496f;
    --face-eng-row: #232d45;
    --side-btn-1: #3f74f0;
    --side-btn-2: #2550c0;
    --side-btn-ink: #ffffff;
    --side-btn-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  h1, h2, h3, p, ol, ul { margin: 0; }
  ol, ul { list-style: none; padding: 0; }

  .app { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  /* ── 상단바 ───────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 2px 10px;
    background: linear-gradient(to bottom, var(--bg) 72%, transparent);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 38px; height: 38px; flex: 0 0 38px;
    display: grid; place-items: center;
    border-radius: 12px; background: var(--brand); color: #fff;
    font-weight: 800; font-size: 14px; letter-spacing: -0.02em;
    box-shadow: 0 6px 16px rgba(47, 107, 255, 0.28);
  }
  .brand-name { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .top-actions { margin-left: auto; display: flex; gap: 6px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface);
    display: grid; place-items: center; font-size: 17px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:active { transform: scale(0.96); }

  main { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  .view { display: block; animation: fade 0.22s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .view-head { padding: 4px 2px 10px; }
  .view-title { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .view-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  /* ── 공용 버튼 ────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px; padding: 9px 14px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface-2); color: var(--text);
    font-size: 14px; font-weight: 700; line-height: 1.1;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  a.btn { text-decoration: none; }
  .btn-clip { background: var(--brand-soft); border-color: transparent; color: var(--brand-ink); }
  .btn.small { min-height: 34px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; }
  .btn.ghost { background: transparent; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(47, 107, 255, 0.24); }
  .btn.wide { width: 100%; }
  .btn.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .btn.act { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }
  .btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }
  .btn:focus-visible, .spd:focus-visible, .lang:focus-visible, .chip:focus-visible, .tab:focus-visible, .dbadge:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .spd-group { display: inline-flex; gap: 3px; padding: 2px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .spd {
    min-height: 30px; padding: 4px 8px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted);
    font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums;
    cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap;
  }
  .spd.is-on { background: var(--brand-soft); color: var(--brand-ink); }
  .spd:active { transform: scale(0.95); }
  .say-ico { font-size: 15px; line-height: 1; }
  .say-rate { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ── 언어 탭 / 장면 칩 ────────────────────────────────── */
  .langbar { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .langbar::-webkit-scrollbar { display: none; }
  .lang {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    min-height: 36px; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 13px; font-weight: 700; color: var(--muted);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .lang.is-on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .lang.is-soon { opacity: 0.72; }
  .lang .soon { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .lang.is-on .soon { background: rgba(255, 255, 255, 0.22); color: #fff; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    padding: 9px 15px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: left;
  }
  .chip .chip-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; color: var(--brand-ink); }
  .chip .chip-label { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .chip.is-on { border-color: var(--brand); background: var(--brand-soft); box-shadow: var(--shadow-sm); }
  .chip.is-static { cursor: default; }

  /* ── 장면 칩 줄 + 큼직한 Eng/Kor 전환 버튼 ───────────── */
  .scene-row { display: flex; align-items: stretch; gap: 8px; padding: 2px 2px 10px; }
  .scene-row .chips { flex: 1 1 auto; min-width: 0; padding: 0; }
  .side-toggle {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-width: 116px; padding: 10px 16px; border-radius: 14px;
    border: 1px solid transparent;
    background: linear-gradient(150deg, var(--side-btn-1) 0%, var(--side-btn-2) 100%);
    color: var(--side-btn-ink);
    font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
    box-shadow: var(--side-btn-shadow);
    cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap;
  }
  .side-toggle .side-flag { font-size: 18px; line-height: 1; }
  .side-toggle .side-lbl { line-height: 1.15; }
  .side-toggle:active { transform: scale(0.97); }
  .side-toggle:focus-visible { outline: 3px solid var(--brand-soft); outline-offset: 2px; }

  .scene-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; padding: 0 2px 4px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 2px 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 11.5px; font-weight: 700; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .pill.is-ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .pill.is-due { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  .meta-note { flex: 1 1 100%; font-size: 12px; color: var(--muted); padding-top: 2px; }

  /* ── 3D 플립 카드 ─────────────────────────────────────── */
  .flip-stage { perspective: 1600px; -webkit-perspective: 1600px; }
  .flip {
    display: grid;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.62s cubic-bezier(0.22, 0.68, 0.24, 1);
    will-change: transform;
  }
  .flip.is-flipped { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    position: relative;
    padding: 14px 14px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    box-shadow: var(--shadow);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.front { transform: rotateY(0deg); background: var(--face-kor-bg); border-color: var(--face-kor-line); }
  .face.back { transform: rotateY(180deg); background: var(--face-eng-bg); border-color: var(--face-eng-line); }
  /* 보이지 않는 면은 터치를 절대 받지 않는다 */
  .face { pointer-events: none; }
  .flip:not(.is-flipped) .face.front { pointer-events: auto; }
  .flip.is-flipped .face.back { pointer-events: auto; }

  .face-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .face-title { display: flex; align-items: center; gap: 8px; }
  .face-flag { font-size: 20px; }
  .face-title b { display: block; font-size: 14px; font-weight: 800; }
  .face-title small { display: block; font-size: 11.5px; color: var(--muted); }
  .head-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .face-head > .btn { margin-left: auto; }
  .play-lbl { font-weight: 800; }
  .rate-tag { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.22); font-variant-numeric: tabular-nums; }
  .btn-play-all.is-playing { background: var(--ok); border-color: var(--ok); }

  .turns { display: flex; flex-direction: column; gap: 9px; padding-top: 12px; }
  .turn {
    border-radius: 14px; padding: 10px 12px;
    background: var(--surface-2); border: 1px solid transparent;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .turn.me { background: var(--me-row); }
  /* 영어(뒷면) 카드에서는 대화 줄을 밝게 띄워 인디고 바탕과 구분 */
  .face.back .turn { background: var(--face-eng-row); }
  .face.back .turn.me { background: var(--me-row); }
  .turn.is-speaking { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .turn-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .badge {
    display: inline-flex; align-items: center;
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.01em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--badge-p-bg); color: var(--badge-p-fg);
  }
  .turn.me .badge { background: var(--badge-m-bg); color: var(--badge-m-fg); }
  .turn-no { font-size: 10.5px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ko { font-size: 16px; line-height: 1.48; margin-top: 5px; letter-spacing: -0.01em; }
  .en { font-size: 16.5px; line-height: 1.42; font-weight: 650; margin-top: 5px; letter-spacing: -0.01em; }
  .ko-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hint-pill {
    display: inline-block; margin-top: 7px;
    padding: 3px 10px; border-radius: 8px;
    background: var(--hint-bg); color: var(--hint-fg);
    border: 1px dashed var(--hint-line);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em;
  }
  .hint-pill::before { content: "💡 "; }
  /* ── 문장별 자동 반복 3 · 5 · 10 ─────────────────────── */
  .rep-row {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: auto; padding-left: 6px;
  }
  .rep-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: 0.02em; color: var(--muted); }
  .rep {
    min-height: 27px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 11px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .rep:active { transform: scale(0.95); }
  .rep.is-on {
    background: var(--brand); border-color: var(--brand); color: #fff;
    box-shadow: 0 4px 12px rgba(47, 107, 255, 0.28);
  }
  .rep:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* ── 전체 듣기 옆 전체 반복 3 · 5 · 7 ────────────────── */
  .all-rep-row { margin-left: 0; padding-left: 0; gap: 3px; }
  .all-rep-row .rep { min-height: 25px; padding: 2px 7px; }
  .all-rep-row .rep-lbl { font-size: 10px; }
  /* ── 한영 모드 토글 (앞면·뒷면 공통) ──────────────────── */
  .koen-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    min-height: 30px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.01em; white-space: nowrap;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .koen-toggle .koen-flag { font-size: 12px; line-height: 1; }
  .koen-toggle .koen-lbl { line-height: 1.1; }
  .koen-toggle:active { transform: scale(0.95); }
  .koen-toggle.is-on {
    background: var(--brand); border-color: var(--brand); color: #fff;
    box-shadow: 0 4px 12px rgba(47, 107, 255, 0.28);
  }
  .koen-toggle:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  @media (max-width: 430px) {
    .koen-toggle { min-height: 28px; padding: 2px 9px; font-size: 11px; }
    .koen-toggle .koen-flag { font-size: 11px; }
  }
  @media (max-width: 430px) {
    .all-rep-row { gap: 2px; }
    .all-rep-row .rep { min-height: 24px; padding: 2px 6px; font-size: 10.5px; }
  }
  .acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-top: 9px; }
  .btn-clip { white-space: nowrap; }
  @media (max-width: 430px) {
    .spd { padding: 4px 6px; font-size: 11px; }
    .back-turn .acts { gap: 5px; }
  }
  .tap-hint { text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 12px; }

  .card-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .btn-learned { min-height: 46px; font-size: 14.5px; }
  .btn-learned.is-done { background: var(--ok-soft); border-color: transparent; color: var(--ok); box-shadow: none; }

  }

    d.setDate(d.getDate() + n);

    var a = parseYMD(fromISO);
    var b = parseYMD(toISO);

    return Math.round((b.getTime() - a.getTime()) / 86400000);

      for (j = 0; j <= m; j++) { row.push(0); }
      dp.push(row);
    }
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        dp[i][j] = sameWord(A[i], B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var ra = [], rb = [], x = 0, y = 0;
    while (x < n && y < m) {
      if (sameWord(A[x], B[y])) {
        ra.push({ w: A[x], ok: true }); rb.push({ w: B[y], ok: true }); x++; y++;
      } else if (dp[x + 1][y] >= dp[x][y + 1]) {
        ra.push({ w: A[x], ok: false }); x++;
      } else {
        rb.push({ w: B[y], ok: false }); y++;
      }
    }
    while (x < n) { ra.push({ w: A[x], ok: false }); x++; }
    while (y < m) { rb.push({ w: B[y], ok: false }); y++; }
    return { mine: ra, answer: rb };
  }

  /* ── DOM 헬퍼 ─────────────────────────────────────────── */
  function clear(node) { node.textContent = ''; }

    for (var i = 0; i < list.length; i++) {
      var c = list[i];

      if (typeof c === 'string' || typeof c === 'number') { node.appendChild(document.createTextNode(String(c))); continue; }

        var v = attrs[k];
        if (v == null || v === false) { continue; }
        if (k === 'class') { n.className = String(v); }
        else if (k === 'text') { n.textContent = String(v); }
        else if (k === 'value') { n.value = String(v); }
        else if (k === 'hidden') { n.hidden = !!v; }
        else if (k === 'disabled') { n.disabled = !!v; }
        else { n.setAttribute(k, v === true ? '' : String(v)); }

  /* ════════════════════════════════════════════════════
     4. 저장소 (localStorage)

  var store = null;

  }

  }

  function saveStore() {
    if (!store) { return; }
    store.v = 1;
    store.updatedAt = todayISO();
    writeRaw(JSON.stringify(store));
  }

  function normalizeStore(o) {
    if (!o || typeof o !== 'object') { o = {}; }
    if (!o.learned || typeof o.learned !== 'object') { o.learned = {}; }
    if (!o.quiz || typeof o.quiz !== 'object') { o.quiz = {}; }
    if (!o.ui || typeof o.ui !== 'object') { o.ui = {}; }
    return o;
  }

  function bootStore() {
    var raw = readRaw();
    var o = null;
    if (raw) {
      try { o = JSON.parse(raw); } catch (e) { o = null; }
    }
    o = normalizeStore(o);
    var seeded = false;
    for (var i = 0; i < CONTENT.scenes.length; i++) {
      var sc = CONTENT.scenes[i];
      var lr = o.learned[sc.id];
      if (!lr || !lr.date) {
        o.learned[sc.id] = { date: sc.learnedDate || todayISO(), confirmed: false };
        seeded = true;
      }
    }
    store = o;
    if (seeded) { saveStore(); }
  }

  function learnedOf(sceneId) {
    var lr = store.learned[sceneId];
    if (!lr || !lr.date) { return null; }
    return lr;
  }

  function setLearned(sceneId, date, confirmed) {
    store.learned[sceneId] = { date: date, confirmed: !!confirmed };
    saveStore();
  }

  function getHist(sceneId, turnId, dayKey) {
    var byScene = store.quiz[sceneId];
    if (!byScene) { return null; }
    var byTurn = byScene[turnId];
    if (!byTurn) { return null; }
    var v = byTurn[dayKey];
    return (v === 'O' || v === 'X') ? v : null;
  }

  function setHist(sceneId, turnId, dayKey, val) {
    if (!store.quiz[sceneId]) { store.quiz[sceneId] = {}; }
    var byScene = store.quiz[sceneId];
    if (!byScene[turnId]) { byScene[turnId] = {}; }
    byScene[turnId][dayKey] = val;
    saveStore();
  }

  function saveUI() {
    if (!store) { return; }
    store.ui = {
      tab: state.tab,
      lang: state.lang,
      sceneId: state.sceneId,
      theme: state.theme,
      speed: state.speed,
      koEn: !!state.koEn,
      practiceScope: state.practiceScope,
      practiceOrder: state.practiceOrder

  }

  /* ════════════════════════════════════════════════════
     5. 앱 상태
     ════════════════════════════════════════════════════ */
  var state = {
    tab: 'study',
    lang: 'en',
    sceneId: CONTENT.scenes[0].id,
    flipped: false,
    speed: 1,
    practiceScope: 'me',
    practiceOrder: 'seq',
    theme: 'auto',
    hints: {},
    /* 한영 모드 — 앞면·뒷면 공통. 켜면 '한국어 → 영어(주력 언어)' 순서로 듣는다. */
    koEn: false,
    practice: null,
    quiz: null
  };

  var refs = {};
  var cardRefs = { flip: null, front: null, back: null, playBtn: null, playLbl: null, stopBtn: null, rateTag: null, frontTurns: {}, backTurns: {}, rateBtns: [] };
  var playToken = null;
  var toastTimer = null;

  function currentScene() {
    return findScene(state.sceneId) || CONTENT.scenes[0];
  }

  /* ════════════════════════════════════════════════════
     6. 음성 — ① 원어민 MP3(1순위) → ② 기기 음성(같은 언어만)
     · 모든 문장은 미리 만들어 둔 원어민 신경망 MP3 로 재생한다.
       (폰의 speechSynthesis 는 음성 팩이 없으면 중국어를 일본어로
        읽어 버리는 식의 엉뚱한 언어 낭독이 있어 1순위에서 뺐다)
     · MP3 가 없거나 재생에 실패한 텍스트만 기기 음성으로 폴백한다.
       단, v.lang 앞 두 글자가 정확히 같은 음성이 실제로 있을 때만 읽고
       다른 언어 음성으로 대신 읽는 일은 절대 하지 않는다.
     ════════════════════════════════════════════════════ */
  var AUDIO_BASE = 'audio/';
  var audioEl = null;      /* 재사용 <audio> 1개 — 모바일에서 재생 잠금 해제 유지 */
  var audioToken = null;

  /* ── 파일 경로 규칙 ──
     · 5개국어 입문: audio/intro-{언어}-{단위}.mp3   예) audio/intro-zh-w1.mp3
     · 영어 회화:    audio/en-{장면}-{대사}.mp3       예) audio/en-cafe-sample-order-t1.mp3 */
  function introAudioUrl(code, unitId) {
    return AUDIO_BASE + 'intro-' + code + '-' + unitId + '.mp3';
  }

  function sceneAudioUrl(sceneId, turnId) {
    return AUDIO_BASE + 'en-' + sceneId + '-' + turnId + '.mp3';
  }

  /* 한영 모드용 한국어 클립 — 회화 audio/ko-{장면}-{대사}.mp3
     입문은 기존 5개국어 규칙(intro-{언어}-{단위})에 맞춰 audio/intro-ko-{단위}.mp3 */
  function koSceneAudioUrl(sceneId, turnId) {
    return AUDIO_BASE + 'ko-' + sceneId + '-' + turnId + '.mp3';
  }

  function koUnitAudioUrl(unitId) {
    return AUDIO_BASE + 'intro-ko-' + unitId + '.mp3';
  }

  function koTurnClip(sc, t) {
    if (!t) { return ''; }
    if (t.koAudio) { return t.koAudio; }
    return koSceneAudioUrl((sc && sc.id) || state.sceneId, t.id);
  }

  function koUnitClip(u) {
    if (!u) { return ''; }
    return u.koAudio || koUnitAudioUrl(u.id);
  }

  /* 단위의 언어별 클립 경로 (데이터에 audio 가 있으면 그 값을 우선) */
  function unitClip(u, code) {
    var d = (u && u.t) ? u.t[code] : null;
    if (!d) { return ''; }
    return d.audio || introAudioUrl(code, u.id);
  }

  /* 대사의 클립 경로 (데이터에 audio 가 있으면 그 값을 우선) */
  function turnClip(sc, t) {
    if (!t) { return ''; }
    if (t.audio) { return t.audio; }
    return sceneAudioUrl((sc && sc.id) || state.sceneId, t.id);
  }

  function audioAvailable() {
    return typeof window.Audio === 'function';
  }

  function clampRate(r) {
    var n = Number(r);

    if (n < 0.5) { return 0.5; }

    return n;
  }

    }
    return audioEl;

    if (!audioEl) { return; }
    try { audioEl.onended = null; } catch (e1) { /* noop */ }
    try { audioEl.onerror = null; } catch (e2) { /* noop */ }
    try { audioEl.pause(); } catch (e3) { /* noop */ }
    try { audioEl.currentTime = 0; } catch (e4) { /* noop */ }
  }

  /* MP3 클립 1개 재생 — 시작했으면 true, 재생 장치/경로가 없으면 false */
  function playClip(url, rate, opts) {
    opts = opts || {};
    if (!url || !audioAvailable()) { return false; }
    stopAudio();
    var a = getAudioEl();
    var token = { active: true, url: url };
    audioToken = token;
    var done = false;
    function finish(okFlag) {
      if (done) { return; }
      done = true;
      try { a.onended = null; } catch (e0) { /* noop */ }
      try { a.onerror = null; } catch (e1) { /* noop */ }
      if (!token.active) { return; }
      token.active = false;
      if (audioToken === token) { audioToken = null; }
      if (okFlag) {
        if (opts.onend) { opts.onend(); }
      } else if (opts.onerror) {
        opts.onerror();
      }
    }
    a.onended = function () { finish(true); };
    a.onerror = function () { finish(false); };
    try {
      a.src = url;
      a.playbackRate = clampRate(rate);
    } catch (e2) {
      finish(false);
      return false;
    }
    try { if (a.load) { a.load(); } } catch (e3) { /* noop */ }
    var p = null;
    try {
      p = a.play();
    } catch (e4) {
      finish(false);
      return false;
    }
    if (p && typeof p.then === 'function') {
      p.then(function () {
        /* 로드 후 배속이 초기화되는 브라우저가 있어 한 번 더 확정 */
        try { a.playbackRate = clampRate(rate); } catch (e5) { /* noop */ }
      }, function () {
        finish(false);
      });
    }
    return true;
  }

  /* ── 기기 음성(폴백 전용) ── */
  function ttsAvailable() {

  }

  function voicesList() {

  }

  /* 해당 언어(예: it-IT) 음성 — 정확한 태그 우선, 없으면 같은 언어의 다른 지역만.
     다른 언어 음성은 절대 돌려주지 않는다. */

    var want = normTag(tag);
    var base = want.split('-')[0];
    var list = voicesList();
    var i;
    for (i = 0; i < list.length; i++) {
      if (normTag(list[i].lang) === want) { return list[i]; }
    }
    for (i = 0; i < list.length; i++) {
      var l = normTag(list[i].lang);
      if (l === base || l.indexOf(base + '-') === 0) { return list[i]; }
    }
    return null;
  }

    try { window.speechSynthesis.cancel(); } catch (e) { /* noop */ }
  }

  /* 같은 언어 음성이 실제로 있을 때만 읽는다. 없으면 안내만 하고 멈춘다. */
  function speakNative(text, langCode, rate, opts) {
    opts = opts || {};
    var L = langDef(langCode);
    if (!ttsAvailable()) {
      if (!opts.silent) {
        toast('소리를 재생하지 못했어요', 'MP3 를 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 눌러주세요.');
      }
      if (opts.onerror) { opts.onerror(); }
      return { played: false, via: 'none', unsupported: true, missingVoice: false };
    }
    var v = voiceFor(L.tts);
    if (!v) {
      if (!opts.silent) {
        toast(L.name + ' 음성이 이 기기에 없어요', '다른 언어로 대신 읽지 않습니다. Chrome 설정에서 ' + L.name + ' 음성 팩을 받아 주세요.');
      }
      if (opts.onerror) { opts.onerror(); }
      return { played: false, via: 'none', unsupported: false, missingVoice: true };
    }
    var synth = window.speechSynthesis;
    if (opts.cancel !== false) {
      try {
        if (synth.speaking || synth.pending) { cancelSpeech(); }
      } catch (e2) { cancelSpeech(); }
    }

    u.lang = L.tts;
    u.rate = clampRate(rate);
    u.pitch = 1;
    u.voice = v;
    var done = false;
    u.onend = function () {
      if (done) { return; }
      done = true;
      if (opts.onend) { opts.onend(); }
    };
    u.onerror = function () {
      if (done) { return; }
      done = true;
      if (opts.onerror) { opts.onerror(); }
    };
    try {
      synth.speak(u);
    } catch (e3) {
      if (opts.onerror) { opts.onerror(); }
      return { played: false, via: 'none', unsupported: true, missingVoice: false };
    }
    return { played: true, via: 'tts', unsupported: false, missingVoice: false };
  }

  /* 여러 언어 공용 재생기 — langCode 는 LANGS 의 code('en','it',…)
     opts.audio 에 MP3 경로가 있으면 그것부터, 실패하면 기기 음성으로. */
  function speakLang(text, langCode, rate, opts) {
    opts = opts || {};
    var url = opts.audio || '';
    if (url) {
      var started = playClip(url, rate, {
        onend: opts.onend,
        onerror: function () {
          var res = speakNative(text, langCode, rate, opts);
          if (opts.onfallback) { opts.onfallback(res); }
        }
      });
      if (started) { return { played: true, via: 'mp3', unsupported: false, missingVoice: false }; }
    }
    return speakNative(text, langCode, rate, opts);
  }

  function speak(text, rate, opts) {
    return speakLang(text, 'en', rate, opts);
  }

  /* ── 한영 모드 — 한국어 → 0.9초 텀 → 영어(주력 언어) ─────
     state.koEn 이 켜져 있으면 문장 듣기·문장 반복·전체 듣기·전체 반복·5개국어 입문
     모두 이 한 세트를 한 회차로 센다. 한국어 MP3 가 없거나 실패하면
     텀 없이 바로 영어로 넘어가고, 영어 클립이 실패하면 기존 폴백과 똑같이 동작한다. */
  var KO_EN_GAP = 900;
  var koPair = null;

  function koEnOn() {
    return !!state.koEn;
  }

  /* 진행 중인 '한국어 → 영어' 타이머만 정리한다(오디오는 부르는 쪽에서 멈춘다) */
  function clearKoPair() {
    var s = koPair;
    if (!s) { return; }
    koPair = null;
    if (s.timer) { clearTimeout(s.timer); s.timer = null; }
    if (s.token) { s.token.active = false; }
  }

  /* cfg: { koUrl, koText, url, text, code, rate, cancel, onend, onerror, onfallback }
     koEn 이 꺼져 있으면 speakLang 과 완전히 같은 동작이다. */
  function speakLangPair(cfg) {
    cfg = cfg || {};
    var plain = {
      audio: cfg.url || '',
      cancel: cfg.cancel,
      onend: cfg.onend,
      onerror: cfg.onerror,
      onfallback: cfg.onfallback
    };
    if (!koEnOn()) { return speakLang(cfg.text, cfg.code, cfg.rate, plain); }
    clearKoPair();
    var s = { token: { active: true }, timer: null };
    koPair = s;
    function done(okFlag) {
      s.token.active = false;
      if (koPair === s) { koPair = null; }
      if (s.timer) { clearTimeout(s.timer); s.timer = null; }
      if (okFlag) {
        if (cfg.onend) { cfg.onend(); }
      } else if (cfg.onerror) {
        cfg.onerror();
      }
    }
    function target() {
      if (!s.token.active) { return; }
      var res = speakLang(cfg.text, cfg.code, cfg.rate, {
        audio: cfg.url,
        cancel: cfg.cancel,
        onfallback: cfg.onfallback,
        onend: function () { done(true); },
        onerror: function () { done(false); }
      });
      return res;
    }
    function gapThenTarget() {
      if (!s.token.active) { return; }
      s.timer = setTimeout(function () { s.timer = null; target(); }, KO_EN_GAP);
    }
    var koStarted = false;
    if (cfg.koUrl) {
      koStarted = playClip(cfg.koUrl, cfg.rate, {
        onend: gapThenTarget,
        /* 한국어 클립이 없거나 실패해도 들려줄 건 들려준다 — 텀 없이 영어로 */
        onerror: target
      });
    }
    if (!koStarted) {
      var resKo = speakNative(cfg.koText || '', 'ko', cfg.rate, {
        silent: true,
        onend: gapThenTarget
      });
      if (!resKo || !resKo.played) { target(); }
    }
    return { played: true, via: 'pair', unsupported: false, missingVoice: false };
  }

  function highlight(turnId) {
    var key;
    for (key in cardRefs.frontTurns) {
      if (Object.prototype.hasOwnProperty.call(cardRefs.frontTurns, key)) {
        cardRefs.frontTurns[key].classList.toggle('is-speaking', key === turnId);
      }
    }
    for (key in cardRefs.backTurns) {
      if (Object.prototype.hasOwnProperty.call(cardRefs.backTurns, key)) {
        cardRefs.backTurns[key].classList.toggle('is-speaking', key === turnId);
      }
    }
  }

  /* 대사 1개 듣기 — 대사 객체를 받는다 (sc 를 주면 그 장면의 클립을 쓴다)
     한영 모드에서는 한국어 → 0.9초 → 영어 한 세트 */
  function speakOne(t, rate, sc) {
    if (!t) { return; }
    var scene = sc || findScene(state.sceneId) || CONTENT.scenes[0];
    stopAll();
    highlight(t.id || null);
    speakLangPair({
      koUrl: koTurnClip(scene, t),
      koText: t.ko,
      text: t.en,
      code: 'en',
      url: turnClip(scene, t),
      rate: rate,
      onend: function () { highlight(null); },
      onerror: function () { highlight(null); }
    });
  }

  /* ── 문장별 자동 반복 3 · 5 · 10 ────────────────────────
     한 문장을 3·5·10회 연속 재생한다(회차 사이 0.5초).
     진행 중인 버튼은 '3 · 1/3' 처럼 진행을 보여 주고,
     같은 버튼을 다시 누르거나 다른 소리를 내면 즉시 멈춘다. */
  var REPEAT_COUNTS = [3, 5, 10];
  var REPEAT_GAP = 500;
  var repState = null;

  /* 반복 상태만 정리한다(오디오·기기 음성은 부르는 쪽에서 멈춘다) */
  function clearRepeat() {
    var s = repState;
    if (!s) { return; }
    repState = null;
    if (s.token) { s.token.active = false; }
    if (s.timer) { clearTimeout(s.timer); s.timer = null; }
    repLabel(s.btn, 0, s.n);
    if (s.turnId) { highlight(null); }
  }

  /* 사용자가 직접 멈춤 — 타이머·MP3·기기 음성까지 */
  function stopRepeat() {
    if (!repState) { return; }
    clearRepeat();
    clearKoPair();
    stopAudio();
    cancelSpeech();
  }

  function repLabel(btn, i, n) {
    if (!btn || !btn.setAttribute) { return; }
    var base = btn.getAttribute('data-rep-label') || String(btn.getAttribute('data-repeat') || '');
    var count = String(n || btn.getAttribute('data-repeat') || '');
    var kind = btn.getAttribute('data-rep-kind') || '자동 반복';
    if (!i) {
      btn.textContent = base;
      btn.classList.remove('is-on');
      btn.setAttribute('aria-pressed', 'false');
      btn.setAttribute('aria-label', count + '회 ' + kind);
      return;
    }
    btn.textContent = count + ' · ' + i + '/' + count;
    btn.classList.add('is-on');
    btn.setAttribute('aria-pressed', 'true');
    btn.setAttribute('aria-label', count + '회 ' + kind + ' 중 ' + i + '/' + count + ' — 누르면 정지');
  }

  /* play(opts) 는 한 회차를 재생하고 opts.onend / opts.onerror 를 부른다 */
  function startRepeat(btn, count, play, turnId) {
    if (!btn || !count || !play) { return false; }
    stopAll();
    var s = { btn: btn, n: count, i: 0, timer: null, token: null, play: play, turnId: turnId || null };
    repState = s;
    if (s.turnId) { highlight(s.turnId); }
    stepRepeat(s);
    return true;
  }

  function stepRepeat(s) {
    if (repState !== s) { return; }
    s.i += 1;
    repLabel(s.btn, s.i, s.n);
    var token = { active: true };
    s.token = token;
    s.play({
      onend: function () {
        if (repState !== s || !token.active) { return; }
        token.active = false;
        if (s.i >= s.n) { finishRepeat(s, false); return; }
        s.timer = setTimeout(function () {
          s.timer = null;
          stepRepeat(s);
        }, REPEAT_GAP);
      },
      onerror: function () {
        if (repState !== s || !token.active) { return; }
        token.active = false;
        finishRepeat(s, true);
      }
    });
  }

  function finishRepeat(s, failed) {
    if (repState === s) {
      repState = null;
      if (s.timer) { clearTimeout(s.timer); s.timer = null; }
      repLabel(s.btn, 0, s.n);
      if (s.turnId) { highlight(null); }
    }
    if (failed) { toast('반복을 멈췄어요', '이 문장 소리를 재생하지 못했습니다.'); }
  }

  /* 반복 버튼 한 묶음 — 한국어 표현 윗줄(화자 라벨 줄)에 붙는다 */
  function repeatRow(makePlay, turnId) {
    var row = el('div', { class: 'rep-row', role: 'group', 'aria-label': '자동 반복' });
    row.appendChild(el('span', { class: 'rep-lbl', text: '반복' }));
    var btns = [];
    for (var i = 0; i < REPEAT_COUNTS.length; i++) {
      (function (n) {
        var b = el('button', {
          class: 'rep',
          type: 'button',
          'data-repeat': String(n),
          'data-rep-label': String(n),
          'aria-pressed': 'false',
          'aria-label': n + '회 자동 반복',
          title: n + '회 연속 듣기',
          text: String(n)
        });
        /* 카드 뒤집기와 겹치지 않도록 클릭을 여기서 끊는다(press 가 stopPropagation) */
        press(b, function (ev) {
          if (ev && ev.stopPropagation) { ev.stopPropagation(); }
          if (repState && repState.btn === b) { stopRepeat(); return; }
          startRepeat(b, n, makePlay(n), turnId);
        });
        btns.push(b);
        row.appendChild(b);
      })(REPEAT_COUNTS[i]);
    }
    row.repBtns = btns;
    return row;
  }

  /* 한 문장을 현재 배속으로 한 번 재생 — 반복 엔진이 부른다
     한영 모드에서는 '한국어 → 영어' 가 한 회차다. */
  function repeatTurnPlay(t, sc) {
    return function (opts) {
      speakLangPair({
        koUrl: koTurnClip(sc, t),
        koText: t.ko,
        text: t.en,
        code: 'en',
        url: turnClip(sc, t),
        rate: state.speed,
        onend: opts.onend,
        onerror: opts.onerror
      });
    };
  }

  function restorePlayBtn() {
    if (!cardRefs.playBtn) { return; }
    cardRefs.playBtn.classList.remove('is-playing');
    if (cardRefs.playLbl) { cardRefs.playLbl.textContent = '🔊 전체 듣기'; }
    if (cardRefs.stopBtn) { cardRefs.stopBtn.hidden = true; }
  }

  function stopAll() {
    if (playToken) { playToken.active = false; playToken = null; }
    clearRepeat();
    clearAllRepeat();
    clearKoPair();
    stopAudio();
    cancelSpeech();
    highlight(null);
    restorePlayBtn();
  }

  function endPlay() {
    if (playToken) { playToken.active = false; playToken = null; }
    highlight(null);
    restorePlayBtn();
  }

  /* ── 뒷면 전체 듣기 · 전체 반복 3 · 5 · 7 ───────────────
     한 회차 = 그 화면의 모든 대사를 순서대로 끝까지.
     회차 사이 0.8초를 두고 3·5·7회 반복한다.
     진행 중인 버튼은 '3 · 1/3' 처럼 회차를 보여 주고,
     같은 버튼을 다시 누르거나 전체 듣기/정지·문장 듣기·배속·카드 뒤집기·화면 전환이
     있으면 타이머와 오디오를 즉시 멈춘다. */
  var ALL_REPEAT_COUNTS = [3, 5, 7];
  var ALL_REPEAT_GAP = 800;
  var allRepState = null;

  /* 전체 반복 상태만 정리한다(오디오·기기 음성은 부르는 쪽에서 멈춘다) */
  function clearAllRepeat() {
    var s = allRepState;
    if (!s) { return; }
    allRepState = null;
    if (s.token) { s.token.active = false; }
    if (s.timer) { clearTimeout(s.timer); s.timer = null; }
    repLabel(s.btn, 0, s.n);
  }

  /* 사용자가 직접 멈춤 — 타이머·MP3·기기 음성·재생 버튼까지 */
  function stopAllRepeat() {
    if (!allRepState) { return; }
    clearAllRepeat();
    stopAll();
  }

  /* items 를 순서대로 한 회차 재생 — play(item, opts) 가 opts.onend/onerror 를 부른다 */
  function playRound(items, play, token, onpass, onfail) {
    var i = 0;
    function step() {
      if (!token.active) { return; }
      if (i >= items.length) { onpass(); return; }
      play(items[i], {
        onend: function () {
          if (!token.active) { return; }
          i += 1;
          step();
        },
        onerror: function () {
          if (!token.active) { return; }
          onfail();
        }
      });
    }
    step();
  }

  function showPlaying(on) {
    if (cardRefs.playBtn) { cardRefs.playBtn.classList.toggle('is-playing', !!on); }
    if (cardRefs.playLbl) { cardRefs.playLbl.textContent = on ? '▶ 재생 중…' : '🔊 전체 듣기'; }
    if (cardRefs.stopBtn) { cardRefs.stopBtn.hidden = !on; }
  }

  /* cfg: { btn, rounds, items, play(item, opts) } — btn 이 없으면 한 번만 재생 */
  function startPlaySequence(cfg) {
    stopAll();
    if (!audioAvailable() && !ttsAvailable()) {
      toast('소리를 재생하지 못했어요', 'MP3 를 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 눌러주세요.');
      return;
    }
    var s = { btn: cfg.btn || null, n: cfg.rounds || 1, i: 0, token: null, timer: null };
    if (s.btn) { allRepState = s; }
    showPlaying(true);
    s.token = { active: true };
    playToken = s.token;
    runPlayRound(s, cfg);
  }

  function runPlayRound(s, cfg) {
    if (!s.token || !s.token.active) { return; }
    s.i += 1;
    if (s.btn) { repLabel(s.btn, s.i, s.n); }
    playRound(cfg.items, cfg.play, s.token, function () {
      if (!s.token || !s.token.active) { return; }
      if (s.i >= s.n) { finishPlaySequence(s, false); return; }
      s.timer = setTimeout(function () {
        s.timer = null;
        runPlayRound(s, cfg);
      }, ALL_REPEAT_GAP);
    }, function () {
      if (!s.token || !s.token.active) { return; }
      finishPlaySequence(s, true);
    });
  }

  function finishPlaySequence(s, failed) {
    if (s.token) { s.token.active = false; }
    if (playToken === s.token) { playToken = null; }
    if (s.timer) { clearTimeout(s.timer); s.timer = null; }
    if (allRepState === s) {
      allRepState = null;
      repLabel(s.btn, 0, s.n);
    }
    endPlay();
    if (failed) { toast('전체 듣기를 멈췄어요', '이 문장 소리를 재생하지 못했습니다.'); }
  }

  /* 지금 장면의 대사 전부를 현재 배속으로 — 전체 듣기·전체 반복의 한 회차
     한영 모드에서는 턴마다 '한국어 → 영어' 를 한 바퀴 돈다. */
  function scenePass(sc) {
    return function (t, opts) {
      highlight(t.id);
      speakLangPair({
        koUrl: koTurnClip(sc, t),
        koText: t.ko,
        text: t.en,
        code: 'en',
        url: turnClip(sc, t),
        rate: state.speed,
        cancel: false,
        onend: opts.onend,
        onerror: opts.onerror
      });
    };
  }

  function playAll() {
    var sc = currentScene();
    startPlaySequence({ rounds: 1, items: sc.turns, play: scenePass(sc) });
  }

  /* '반복' 라벨 + 3 · 5 · 7 — 전체 듣기 버튼 옆(같은 컨트롤 줄)에 붙는다 */
  function allRepeatRow(makeCfg) {
    var row = el('div', { class: 'rep-row all-rep-row', role: 'group', 'aria-label': '전체 듣기 반복' });
    row.appendChild(el('span', { class: 'rep-lbl', text: '반복' }));
    for (var i = 0; i < ALL_REPEAT_COUNTS.length; i++) {
      (function (n) {
        var b = el('button', {
          class: 'rep rep-all',
          type: 'button',
          'data-repeat': String(n),
          'data-rep-label': String(n),
          'data-rep-kind': '전체 듣기 반복',
          'data-rep-all': 'true',
          'aria-pressed': 'false',
          'aria-label': n + '회 전체 듣기 반복',
          title: '전체 듣기 ' + n + '회 반복',
          text: String(n)
        });
        /* 카드 뒤집기와 겹치지 않도록 클릭을 여기서 끊는다(press 가 stopPropagation) */
        press(b, function (ev) {
          if (ev && ev.stopPropagation) { ev.stopPropagation(); }
          if (allRepState && allRepState.btn === b) { stopAllRepeat(); return; }
          var cfg = makeCfg();
          cfg.btn = b;
          cfg.rounds = n;
          startPlaySequence(cfg);
        });
        row.appendChild(b);
      })(ALL_REPEAT_COUNTS[i]);
    }
    return row;
  }

  /* ── 한영 모드 토글 (앞면·뒷면 공통) ───────────────────
     앞면에서 켜면 뒷면 토글도, 뒷면에서 켜면 앞면 토글도 즉시 같이 바뀐다.
     상태는 state.koEn 하나이고 store.ui.koEn 에 저장된다. */
  var koEnRefs = [];

  function koEnTargetName() {
    var L = langDef(state.lang);
    return L.intro ? L.name : '영어';
  }

  function koEnLabel() {
    var L = langDef(state.lang);
    return L.intro ? ('한' + L.short) : '한영';
  }

  function koEnHint() {
    return '한국어 → ' + koEnTargetName() + ' 순서로 듣기 ' + (state.koEn ? '켜짐' : '꺼짐');
  }

  function koEnToggle() {
    var lbl = el('span', { class: 'koen-lbl', text: koEnLabel() });
    var b = el('button', {
      class: 'koen-toggle' + (state.koEn ? ' is-on' : ''),
      type: 'button',
      'data-act': 'koen',
      'data-koen': koEnLabel(),
      'aria-pressed': state.koEn ? 'true' : 'false',
      'aria-label': '한영 모드 — ' + koEnHint() + ' (누르면 바꿈)',
      title: koEnHint() + ' · 누르면 바꿈'
    }, [
      el('span', { class: 'koen-flag', 'aria-hidden': 'true', text: '🇰🇷' }),
      lbl
    ]);
    b.koenLbl = lbl;
    /* 카드 뒤집기와 겹치지 않도록 클릭을 여기서 끊는다 */
    press(b, function (ev) {
      if (ev && ev.stopPropagation) { ev.stopPropagation(); }
      setKoEn(!state.koEn);
    });
    koEnRefs.push(b);
    return b;
  }

  function syncKoEn() {
    for (var i = 0; i < koEnRefs.length; i++) {
      var b = koEnRefs[i];
      if (!b) { continue; }
      b.classList.toggle('is-on', !!state.koEn);
      b.setAttribute('aria-pressed', state.koEn ? 'true' : 'false');
      b.setAttribute('aria-label', '한영 모드 — ' + koEnHint() + ' (누르면 바꿈)');
      b.setAttribute('title', koEnHint() + ' · 누르면 바꿈');
      b.setAttribute('data-koen', koEnLabel());
      if (b.koenLbl) { b.koenLbl.textContent = koEnLabel(); }
    }
  }

  function setKoEn(on) {
    state.koEn = !!on;
    saveUI();
    syncKoEn();
    /* 켜고 끄는 순간 진행 중이던 오디오·타이머(반복·전체 듣기 포함)를 즉시 정리 */
    stopAll();
    if (state.koEn) {
      toast('한영 모드 켜짐', '한국어 → ' + koEnTargetName() + ' 순서로 들려드려요.');
    } else {
      toast('한영 모드 꺼짐', koEnTargetName() + '만 재생합니다.');
    }
  }

  /* ════════════════════════════════════════════════════
     7. 토스트 · 테마
     ════════════════════════════════════════════════════ */
  function toast(msg, sub) {
    if (!refs.toast) { return; }
    refs.toastMsg.textContent = msg;
    if (sub) {
      refs.toastSub.textContent = sub;
      refs.toastSub.hidden = false;
    } else {
      refs.toastSub.textContent = '';
      refs.toastSub.hidden = true;
    }
    refs.toast.hidden = false;
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { if (refs.toast) { refs.toast.hidden = true; } }, 3000);
  }

  function resolveTheme() {
    var choice = state.theme || 'auto';
    if (choice === 'auto') {
      var mq = null;
      try { mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null; } catch (e) { mq = null; }
      return (mq && mq.matches) ? 'dark' : 'light';
    }
    return choice === 'dark' ? 'dark' : 'light';
  }

  function applyTheme() {
    var resolved = resolveTheme();
    document.documentElement.setAttribute('data-theme', resolved);
    try { document.documentElement.style.colorScheme = resolved; } catch (e) { /* noop */ }
    if (refs.themeIcon) { refs.themeIcon.textContent = state.theme === 'auto' ? '🌗' : (state.theme === 'dark' ? '🌙' : '☀️'); }
    if (refs.themeBtn) {
      var name = state.theme === 'auto' ? '자동' : (state.theme === 'dark' ? '다크' : '라이트');
      refs.themeBtn.setAttribute('title', '테마: ' + name);
      refs.themeBtn.setAttribute('aria-label', '테마: ' + name + ' (누르면 바뀜)');
    }
    if (refs.themeColor) { refs.themeColor.setAttribute('content', resolved === 'dark' ? '#0a0d14' : '#eef1f7'); }
  }

  function cycleTheme() {
    var next = state.theme === 'auto' ? 'light' : (state.theme === 'light' ? 'dark' : 'auto');
    state.theme = next;
    saveUI();
    applyTheme();
    var name = next === 'auto' ? '자동' : (next === 'dark' ? '다크' : '라이트');
    toast('테마: ' + name);
  }

  /* ════════════════════════════════════════════════════
     8. 학습 탭 — 언어 · 장면 · 플립 카드
     ════════════════════════════════════════════════════ */
  function langBar() {
    var wrap = el('div', { class: 'langbar', role: 'tablist', 'aria-label': '언어 선택' });
    for (var i = 0; i < LANGS.length; i++) {
      (function (l) {
        var on = l.code === state.lang;
        var b = el('button', {
          class: 'lang' + (on ? ' is-on' : ''),
          type: 'button',
          role: 'tab',
          'data-lang': l.code,
          'aria-selected': on ? 'true' : 'false',
          title: l.name + (l.intro ? ' (5개국어 입문)' : ' (메인 회화)')
        }, [
          el('span', { text: l.tab })
        ]);
        press(b, function () {
          if (state.lang === l.code) { return; }
          state.lang = l.code;
          state.flipped = false;
          saveUI();
          renderStudy();
        });
        wrap.appendChild(b);
      })(LANGS[i]);
    }
    return wrap;
  }

  function sceneChips() {
    var wrap = el('div', { class: 'chips', 'aria-label': '장면 선택' });
    for (var i = 0; i < CONTENT.scenes.length; i++) {
      (function (sc) {
        var on = sc.id === state.sceneId;
        var parts = String(sc.chip || '').split(' · ');
        var kicker = parts.length > 1 ? parts[0] : sc.chapter;
        var label = parts.length > 1 ? parts.slice(1).join(' · ') : sc.chip;
        var b = el('button', {
          class: 'chip' + (on ? ' is-on' : ''),
          type: 'button',
          'aria-pressed': on ? 'true' : 'false',
          'data-scene': sc.id
        }, [
          el('span', { class: 'chip-kicker', text: kicker }),
          el('span', { class: 'chip-label', text: label })
        ]);
        press(b, function () {
          if (sc.id !== state.sceneId) { selectScene(sc.id); }
        });
        wrap.appendChild(b);
      })(CONTENT.scenes[i]);
    }
    return wrap;
  }

  /* ── 큰 보기 전환 버튼 (장면 칩 줄 오른쪽) ─────────────
     오늘 주력 언어(상단에서 고른 5개국어)에 따라 라벨이 바뀐다. */
  var sideRefs = { btn: null, flag: null, lbl: null };

  function sideNames() {
    var L = langDef(state.lang);
    if (L.intro) {
      return { flag: L.flag, short: L.short, name: L.name };
    }
    return { flag: '🇺🇸', short: 'Eng', name: '영어' };
  }

  function sideToggle() {
    var back = !!state.flipped;
    var s = sideNames();
    var flag = el('span', { class: 'side-flag', 'aria-hidden': 'true', text: back ? '🇰🇷' : s.flag });
    var lbl = el('span', { class: 'side-lbl', text: back ? 'Kor 보기' : (s.short + ' 보기') });
    var btn = el('button', {
      class: 'side-toggle' + (back ? ' is-back' : ''),
      type: 'button',
      'data-act': 'side-toggle',
      'data-lang': state.lang,
      'aria-pressed': back ? 'true' : 'false',
      'aria-label': back ? '한국어 화면으로 전환' : (s.name + ' 화면으로 전환'),
      title: back ? '한국어 화면으로 전환' : (s.name + ' 화면으로 전환')
    }, [flag, lbl]);
    press(btn, function () { setFlip(!state.flipped); });
    sideRefs = { btn: btn, flag: flag, lbl: lbl };
    return btn;
  }

  function syncSideToggle() {
    if (!sideRefs.btn) { return; }
    var back = !!state.flipped;
    var s = sideNames();
    if (sideRefs.lbl) { sideRefs.lbl.textContent = back ? 'Kor 보기' : (s.short + ' 보기'); }
    if (sideRefs.flag) { sideRefs.flag.textContent = back ? '🇰🇷' : s.flag; }
    sideRefs.btn.classList.toggle('is-back', back);
    sideRefs.btn.setAttribute('aria-pressed', back ? 'true' : 'false');
    sideRefs.btn.setAttribute('aria-label', back ? '한국어 화면으로 전환' : (s.name + ' 화면으로 전환'));
    sideRefs.btn.setAttribute('title', back ? '한국어 화면으로 전환' : (s.name + ' 화면으로 전환'));
  }

  function sceneRow() {
    var row = el('div', { class: 'scene-row' });
    row.appendChild(sceneChips());
    row.appendChild(sideToggle());
    return row;
  }

  function nextReview(sc) {
    var lr = learnedOf(sc.id);
    if (!lr) { return null; }
    var today = todayISO();
    for (var i = 0; i < INTERVALS.length; i++) {
      var d = INTERVALS[i];
      var key = 'D' + d;
      var date = addDays(lr.date, d);
      var allDone = true;
      for (var j = 0; j < sc.turns.length; j++) {
        if (!getHist(sc.id, sc.turns[j].id, key)) { allDone = false; break; }
      }
      if (date > today) { return { dayKey: key, date: date, due: false, done: allDone }; }
      if (!allDone) { return { dayKey: key, date: date, due: true, done: false }; }
    }
    return null;
  }

  function metaStrip(sc) {
    var wrap = el('div', { class: 'meta' });
    var lr = learnedOf(sc.id);
    var today = todayISO();
    if (!lr) {
      wrap.appendChild(el('span', { class: 'pill', text: '학습 전' }));
      return wrap;
    }
    var elapsed = daysBetween(lr.date, today);
    wrap.appendChild(el('span', { class: 'pill', text: '학습 시작 ' + shortDate(lr.date) }));
    wrap.appendChild(el('span', { class: 'pill', text: 'D+' + (elapsed > 0 ? elapsed : 0) }));
    if (lr.confirmed && lr.date === today) {
      wrap.appendChild(el('span', { class: 'pill is-ok', text: '✓ 오늘 학습 완료' }));
    }
    var nx = nextReview(sc);
    var note;
    if (!nx) {
      note = 'D+30까지 모든 복습 일정을 마쳤어요.';
    } else if (nx.due) {
      wrap.appendChild(el('span', { class: 'pill is-due', text: nx.dayKey + ' 복습 도래' }));
      note = '오늘 ' + nx.dayKey + ' 복습이 도래했어요 · ' + fmtDate(nx.date);
    } else {
      note = '다음 복습 ' + nx.dayKey + ' · ' + fmtDate(nx.date);
    }
    wrap.appendChild(el('p', { class: 'meta-note', text: note }));
    return wrap;
  }

  function badgeFor(turn) {
    return el('span', { class: 'badge', text: roleName(turn) });
  }

  function bindHint(btn, pill) {
    press(btn, function () {
      var showing = !pill.hidden;
      pill.hidden = showing;
      btn.setAttribute('aria-expanded', showing ? 'false' : 'true');
      btn.textContent = showing ? '힌트' : '힌트 숨김';
    });
  }

  function frontTurn(t, idx) {
    var li = el('li', { class: 'turn ' + t.speaker, 'data-turn': t.id, 'data-side': 'front' });
    var head = el('div', { class: 'turn-head' }, [badgeFor(t), el('span', { class: 'turn-no', text: (idx + 1) + '.' })]);
    var sc0 = currentScene();
    head.appendChild(repeatRow(function () { return repeatTurnPlay(t, sc0); }, t.id));
    li.appendChild(head);
    li.appendChild(el('p', { class: 'ko', text: t.ko }));

    var pill = el('p', { class: 'hint-pill', hidden: true, text: t.hint });

    var acts = el('div', { class: 'acts' });
    var hintBtn = el('button', { class: 'btn ghost small btn-hint', type: 'button', 'aria-expanded': 'false', 'data-hint-btn': t.id, text: '힌트' });
    bindHint(hintBtn, pill);
    acts.appendChild(hintBtn);

    var sayRate = el('span', { class: 'say-rate', text: speedLabel(state.speed) });
    var say = el('button', { class: 'btn small btn-say', type: 'button', 'data-say': t.id, 'aria-label': '이 대사를 영어로 듣기' }, [
      el('span', { class: 'say-ico', 'aria-hidden': 'true', text: '🔊' }),
      sayRate
    ]);
    press(say, function () { speakOne(t, state.speed); });
    acts.appendChild(say);

    var group = el('span', { class: 'spd-group', 'aria-label': '배속' });
    var rates = [];
    for (var i = 0; i < SPEEDS_FRONT.length; i++) {
      (function (r) {
        var b = el('button', {
          class: 'spd' + (state.speed === r ? ' is-on' : ''),
          type: 'button',
          'data-rate': String(r),
          'aria-pressed': state.speed === r ? 'true' : 'false',
          'aria-label': speedLabel(r) + ' 속도로 듣기',
          text: speedLabel(r)
        });
        press(b, function () {
          state.speed = r;
          saveUI();
          syncSpeed();
          speakOne(t, r);
        });
        rates.push(b);
        group.appendChild(b);
      })(SPEEDS_FRONT[i]);
    }
    acts.appendChild(group);

    li.appendChild(pill);
    li.appendChild(acts);
    return { node: li, rates: rates, sayRate: sayRate };
  }

  function clipQuery(turn) {
    var hint = String(turn.hint || '').split('/')[0].replace(/\s+/g, ' ').trim();
    return hint || String(turn.en || '').trim();
  }

  function clipFor(turn) {
    if (turn.clipUrl) {
      return { url: String(turn.clipUrl), label: '🎬 클립', site: 'custom', q: String(turn.en || ''), title: '연결된 영상 장면을 새 탭에서 열기' };
    }
    var cfg = turn.clip || {};
    var q = cfg.q ? String(cfg.q) : clipQuery(turn);
    var site = cfg.site;
    if (site !== 'youglish' && site !== 'playphrase') {
      site = q.split(/\s+/).length >= 2 ? 'playphrase' : 'youglish';
    }
    if (site === 'youglish') {
      return {
        url: 'https://youglish.com/pronounce/' + encodeURIComponent(q) + '/english',
        label: '▶ 유튜브 발음',
        site: 'youglish',
        q: q,
        title: 'youglish에서 “' + q + '” 발음 영상 찾기'
      };
    }
    return {
      url: 'https://www.playphrase.me/#/search?q=' + encodeURIComponent(q),
      label: '🎬 영화 클립',
      site: 'playphrase',
      q: q,
      title: 'playphrase.me에서 “' + q + '” 영화 장면 찾기'
    };
  }

  function backTurn(t, idx) {
    var li = el('li', { class: 'turn back-turn ' + t.speaker, 'data-turn': t.id, 'data-side': 'back' });
    li.appendChild(el('div', { class: 'turn-head' }, [badgeFor(t), el('span', { class: 'turn-no', text: (idx + 1) + '.' })]));
    li.appendChild(el('p', { class: 'en', lang: 'en', text: t.en }));
    li.appendChild(el('p', { class: 'ko-sub', text: t.ko }));

    var group = el('span', { class: 'spd-group', 'aria-label': '문장 배속' });
    var backRates = [];
    for (var i = 0; i < SPEEDS_BACK.length; i++) {
      (function (s) {
        var b = el('button', { class: 'spd spd-b' + (state.speed === s.r ? ' is-on' : ''), type: 'button', 'data-brate': String(s.r), 'aria-pressed': state.speed === s.r ? 'true' : 'false', 'aria-label': s.label + ' 속도로 듣기', text: s.label });
        press(b, function () {
          state.speed = s.r;
          saveUI();
          syncSpeed();
          speakOne(t, s.r);
        });
        backRates.push(b);
        group.appendChild(b);
      })(SPEEDS_BACK[i]);
    }
    var acts = el('div', { class: 'acts' });
    var clip = clipFor(t);
    if (clip) {
      var link = el('a', {
        class: 'btn ghost small btn-clip',
        href: clip.url,
        target: '_blank',
        rel: 'noopener',
        'data-site': clip.site,
        'data-q': clip.q,
        title: clip.title,
        'aria-label': clip.label + ' — 새 탭에서 열기'
      }, [clip.label]);
      link.addEventListener('click', function (ev) {
        /* 링크 이동은 그대로, 카드 플립만 막는다 */
        if (ev && ev.stopPropagation) { ev.stopPropagation(); }
      });
      acts.appendChild(link);
    }
    acts.appendChild(group);
    li.appendChild(acts);
    return { node: li, rates: backRates };
  }

  function syncSpeed() {
    for (var i = 0; i < cardRefs.rateBtns.length; i++) {
      var b = cardRefs.rateBtns[i];
      var r = Number(b.getAttribute('data-rate'));
      var on = r === state.speed;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    if (cardRefs.rateTag) { cardRefs.rateTag.textContent = speedLabel(state.speed); }
    var says = cardRefs.sayRates || [];
    for (var k = 0; k < says.length; k++) { says[k].textContent = speedLabel(state.speed); }
    var brates = cardRefs.backRateBtns || [];
    for (var m = 0; m < brates.length; m++) {
      var rb = Number(brates[m].getAttribute('data-brate'));
      var ron = rb === state.speed;
      brates[m].classList.toggle('is-on', ron);
      brates[m].setAttribute('aria-pressed', ron ? 'true' : 'false');
    }
  }

  function buildCard(sc) {
    cardRefs = { flip: null, front: null, back: null, playBtn: null, playLbl: null, stopBtn: null, rateTag: null, frontTurns: {}, backTurns: {}, rateBtns: [], backRateBtns: [], sayRates: [] };
    koEnRefs = [];

    var flip = el('div', { class: 'flip', id: 'flip' });
    var front = el('section', { class: 'face front', 'aria-label': '한국어 화면' });
    var back = el('section', { class: 'face back', 'aria-label': '영어 화면' });

    /* 앞면 */
    var toBack = press(el('button', { class: 'btn ghost small btn-flip', type: 'button', text: '↻ 영어 전체 보기' }), function () { setFlip(true); });
    front.appendChild(el('div', { class: 'face-head' }, [
      el('div', { class: 'face-title' }, [
        el('span', { class: 'face-flag', 'aria-hidden': 'true', text: '🇰🇷' }),
        el('div', {}, [el('b', { text: '한국어 → 영어' }), el('small', { text: '카드를 탭하면 영어 전체가 보여요' })])
      ]),
      el('div', { class: 'head-btns' }, [koEnToggle(), toBack])
    ]));

    var frontList = el('ol', { class: 'turns' });
    for (var i = 0; i < sc.turns.length; i++) {
      var built = frontTurn(sc.turns[i], i);
      frontList.appendChild(built.node);
      cardRefs.frontTurns[sc.turns[i].id] = built.node;
      for (var q = 0; q < built.rates.length; q++) { cardRefs.rateBtns.push(built.rates[q]); }
      cardRefs.sayRates.push(built.sayRate);
    }
    front.appendChild(frontList);
    front.appendChild(el('p', { class: 'tap-hint', text: '빈 곳을 탭하면 카드가 뒤집혀요' }));

    /* 뒷면 */
    var playLbl = el('span', { class: 'play-lbl', text: '🔊 전체 듣기' });
    var rateTag = el('span', { class: 'rate-tag', text: speedLabel(state.speed) });
    var playBtn = el('button', { class: 'btn primary small btn-play-all', type: 'button' }, [playLbl, rateTag]);
    press(playBtn, function () { playAll(); });
    var stopBtn = el('button', { class: 'btn small btn-stop', type: 'button', text: '⏹ 정지', hidden: true });
    press(stopBtn, function () { stopAll(); });
    var toFront = press(el('button', { class: 'btn ghost small btn-flip', type: 'button', text: '↻ 한국어로 돌아가기' }), function () { setFlip(false); });
    /* 전체 듣기 옆 전체 반복 3 · 5 · 7 — 누른 시점의 장면을 한 회차로 삼는다 */
    var allRep = allRepeatRow(function () {
      var cur = currentScene();
      return { items: cur.turns, play: scenePass(cur) };
    });

    back.appendChild(el('div', { class: 'face-head' }, [
      el('div', { class: 'face-title' }, [
        el('span', { class: 'face-flag', 'aria-hidden': 'true', text: '🇺🇸' }),
        el('div', {}, [el('b', { text: 'English' }), el('small', { text: '문장마다 원하는 속도로 들어보세요' })])
      ]),
      el('div', { class: 'head-btns' }, [playBtn, koEnToggle(), allRep, stopBtn, toFront])
    ]));

    var backList = el('ol', { class: 'turns' });
    for (var j = 0; j < sc.turns.length; j++) {
      var bb = backTurn(sc.turns[j], j);
      backList.appendChild(bb.node);
      cardRefs.backTurns[sc.turns[j].id] = bb.node;
      for (var br = 0; br < bb.rates.length; br++) { cardRefs.backRateBtns.push(bb.rates[br]); }
    }
    back.appendChild(backList);

    var lr = learnedOf(sc.id);
    var doneToday = !!(lr && lr.confirmed && lr.date === todayISO());
    var learnedBtn = el('button', {
      class: 'btn primary wide btn-learned' + (doneToday ? ' is-done' : ''),
      type: 'button',
      text: doneToday ? '✓ 오늘 학습 완료됨 (진도 기록)' : '✓ 오늘 학습 완료 (진도 기록)'
    });
    press(learnedBtn, function () { markLearned(); });
    var footNote = el('p', {
      class: 'foot-note',
      text: doneToday
        ? '진도가 기록됐어요 · D+1 복습은 ' + fmtDate(addDays(lr.date, 1)) + '부터'
        : '누르면 오늘 날짜로 진도가 기록되고 D+1 복습 일정이 시작돼요.'
    });
    back.appendChild(el('div', { class: 'card-foot' }, [learnedBtn, footNote]));

    flip.appendChild(front);
    flip.appendChild(back);
    flip.addEventListener('click', function (ev) {
      var t = ev && ev.target;
      if (t && t.closest) {
        if (t.closest('button') || t.closest('a') || t.closest('input') || t.closest('textarea') || t.closest('.hint-pill')) { return; }
      }
      setFlip(!state.flipped);
    });

    cardRefs.flip = flip;
    cardRefs.front = front;
    cardRefs.back = back;
    cardRefs.playBtn = playBtn;
    cardRefs.playLbl = playLbl;
    cardRefs.stopBtn = stopBtn;
    cardRefs.rateTag = rateTag;

    var stage = el('div', { class: 'flip-stage' }, [flip]);
    return stage;
  }

  function setFlip(next) {
    state.flipped = !!next;
    if (!cardRefs.flip) { return; }
    /* 어느 쪽으로 뒤집어도 진행 중인 전체 듣기·반복은 즉시 멈춘다 */
    stopAll();
    cardRefs.flip.classList.toggle('is-flipped', state.flipped);
    syncSideToggle();
    cardRefs.front.setAttribute('aria-hidden', state.flipped ? 'true' : 'false');
    cardRefs.back.setAttribute('aria-hidden', state.flipped ? 'false' : 'true');
    if (cardRefs.front.setAttribute) {
      if (state.flipped) { cardRefs.front.setAttribute('inert', ''); cardRefs.back.removeAttribute && cardRefs.back.removeAttribute('inert'); }
      else { cardRefs.back.setAttribute('inert', ''); if (cardRefs.front.removeAttribute) { cardRefs.front.removeAttribute('inert'); } }
    }
  }

  function markLearned() {
    var sc = currentScene();
    var lr = learnedOf(sc.id);
    var today = todayISO();
    if (lr && lr.confirmed && lr.date === today) {
      toast('이미 오늘 학습 완료로 기록됐어요', '내일 D+1 복습부터 Quiz에 나옵니다.');
      return;
    }
    if (lr && lr.confirmed && lr.date !== today) {
      var ok = true;
      if (window.confirm) {
        ok = window.confirm('복습 일정을 오늘(' + fmtDate(today) + ')부터 다시 시작할까요?\n지난 Quiz 성적은 지워지지 않습니다.');
      }
      if (!ok) { return; }
    }
    setLearned(sc.id, today, true);
    renderStudy();
    updateBadge();
    toast('오늘 학습 완료로 기록했어요', 'D+1 복습은 ' + fmtDate(addDays(today, 1)) + '부터 Quiz에 나옵니다.');
  }

  function renderStudy() {
    var root = refs.study;
    if (!root) { return; }
    /* 장면·언어·탭을 바꾸면 진행 중인 반복·전체 듣기를 먼저 끊는다 */
    stopAll();
    clear(root);
    root.appendChild(langBar());
    if (isIntroLang(state.lang)) { renderIntroStudy(root); return; }
    renderEnglishStudy(root);
  }

  function renderEnglishStudy(root) {
    var sc = currentScene();
    root.appendChild(sceneRow());
    root.appendChild(el('p', { class: 'scene-title', text: sc.title }));
    root.appendChild(metaStrip(sc));
    root.appendChild(buildCard(sc));
    setFlip(state.flipped);
    if (refs.brandSub) { refs.brandSub.textContent = sc.chapter + ' · ' + sc.turns.length + '문장'; }
  }

  /* ════════════════════════════════════════════════════
     8-B. 5개국어 입문 — Kor 앞면 + 주력 언어 뒷면
     ════════════════════════════════════════════════════ */
  var miniRefs = {};

  function introChip() {
    return el('div', { class: 'chip is-on is-static', 'data-intro': INTRO.id }, [
      el('span', { class: 'chip-kicker', text: INTRO.chipKicker }),
      el('span', { class: 'chip-label', text: INTRO.chipLabel })
    ]);
  }

  function introSceneRow() {
    var row = el('div', { class: 'scene-row' });
    row.appendChild(el('div', { class: 'chips', 'aria-label': '학습 세트' }, [introChip()]));
    row.appendChild(sideToggle());
    return row;
  }

  function introMeta(L) {
    var wrap = el('div', { class: 'meta' });
    wrap.appendChild(el('span', { class: 'pill is-ok', text: '입문 샘플 · ' + INTRO.units.length + '단위' }));
    wrap.appendChild(el('span', { class: 'pill', text: '주력 ' + L.flag + ' ' + L.name }));
    wrap.appendChild(el('p', {
      class: 'meta-note',
      text: '단어 3 + 회화 3 + 문법 1 · 줄마다 국기 버튼을 누르면 발음과 소리가 바로 나와요. 카드를 탭하면 ' + L.name + ' 전체가 보여요.'
    }));
    return wrap;
  }

  function renderIntroStudy(root) {
    var L = langDef(state.lang);
    root.appendChild(introSceneRow());
    root.appendChild(el('p', { class: 'scene-title', text: INTRO.title }));
    root.appendChild(introMeta(L));
    root.appendChild(buildIntroCard(L));
    setFlip(state.flipped);
    if (refs.brandSub) { refs.brandSub.textContent = '입문 · 5개국어 · ' + INTRO.units.length + '단위'; }
  }

  function introKoText(u) {
    return u.sub ? u.ko + ' (' + u.sub + ')' : u.ko;
  }

  function introFrontUnit(u, idx) {
    var li = el('li', { class: 'turn intro-unit', 'data-unit': u.id, 'data-kind': u.kind, 'data-side': 'front' });
    var head = el('div', { class: 'turn-head' }, [
      el('span', { class: 'badge kind-' + u.kind, text: u.kindLabel }),
      el('span', { class: 'turn-no', text: (idx + 1) + '.' })
    ]);
    head.appendChild(repeatRow(function () { return repeatUnitPlay(u); }, u.id));
    li.appendChild(head);
    li.appendChild(el('p', { class: 'ko', text: introKoText(u) }));
    if (u.hint) { li.appendChild(el('p', { class: 'unit-hint', text: u.hint })); }

    var row = el('div', { class: 'mini-row', role: 'group', 'aria-label': introKoText(u) + ' 5개국어 보기' });
    var btns = {};
    for (var i = 0; i < INTRO_CODES.length; i++) {
      (function (code) {
        var L = langDef(code);
        var b = el('button', {
          class: 'mini',
          type: 'button',
          'data-unit': u.id,
          'data-lang': code,
          'aria-pressed': 'false',
          'aria-label': L.name + '로 보기',
          title: L.name
        }, [el('span', { class: 'mini-flag', 'aria-hidden': 'true', text: L.flag })]);
        press(b, function () { openMini(u, code, b); });
        btns[code] = b;
        row.appendChild(b);
      })(INTRO_CODES[i]);
    }
    li.appendChild(row);

    var panel = el('div', { class: 'mini-panel', hidden: true });
    li.appendChild(panel);
    miniRefs[u.id] = { panel: panel, btns: btns, current: null };
    return li;
  }

  function openMini(u, code, btn) {
    var r = miniRefs[u.id];
    if (!r) { return; }
    var d = u.t && u.t[code];
    if (!d) { return; }
    var L = langDef(code);
    r.current = code;

    clear(r.panel);
    r.panel.appendChild(el('div', { class: 'mini-top' }, [
      el('span', { class: 'mini-flag-lg', 'aria-hidden': 'true', text: L.flag }),
      el('span', { class: 'mini-lang', text: L.name })
    ]));
    r.panel.appendChild(el('p', { class: 'mini-orig', lang: L.tts, text: d.text }));
    r.panel.appendChild(el('p', { class: 'mini-pron' }, [
      el('span', { class: 'mini-pron-lbl', text: '발음 ' }),
      el('b', { class: 'mini-pron-bold', text: d.pron })
    ]));
    if (d.aux) { r.panel.appendChild(el('p', { class: 'mini-aux', text: d.aux })); }
    if (d.ex) {
      r.panel.appendChild(el('div', { class: 'mini-ex' }, [
        el('p', { class: 'mini-ex-text', lang: L.tts, text: d.ex }),
        el('p', { class: 'mini-ex-pron' }, [el('span', { text: '발음 ' }), el('b', { text: d.exPron || '' })]),
        d.exKo ? el('p', { class: 'mini-ex-ko', text: d.exKo }) : null
      ]));
    }
    if (d.tip) { r.panel.appendChild(el('p', { class: 'mini-tip', text: d.tip })); }
    var note = el('p', { class: 'mini-note', hidden: true });
    r.panel.appendChild(note);
    r.panel.hidden = false;

    var k;
    for (k in r.btns) {
      if (!Object.prototype.hasOwnProperty.call(r.btns, k)) { continue; }
      r.btns[k].setAttribute('aria-pressed', k === code ? 'true' : 'false');
      r.btns[k].classList.toggle('is-on', k === code);
    }
    if (btn && btn.classList) { btn.classList.add('is-on'); }

    stopAll();
    function showNoVoice() {
      note.textContent = '이 기기에 ' + L.name + ' 음성이 없어요 · 다른 언어로 읽지 않습니다. Chrome 설정에서 ' + L.name + ' 음성 팩을 받아 주세요';
      note.hidden = false;
    }
    var res = speakLangPair({
      koUrl: koUnitClip(u),
      koText: u.ko,
      text: sayOf(d),
      code: code,
      url: unitClip(u, code),
      rate: state.speed,
      onfallback: function (r2) { if (r2 && r2.missingVoice) { showNoVoice(); } }
    });
    if (!koEnOn() && res && res.missingVoice) { showNoVoice(); }
  }

  function speakUnit(u, code, rate, unitId) {
    var d = u.t && u.t[code];
    if (!d) { return; }
    stopAll();
    highlight(unitId || u.id);
    speakLangPair({
      koUrl: koUnitClip(u),
      koText: u.ko,
      text: sayOf(d),
      code: code,
      url: unitClip(u, code),
      rate: rate || state.speed,
      onend: function () { highlight(null); },
      onerror: function () { highlight(null); }
    });
  }

  /* 한 단위를 지금 고른 주력 언어로 한 번 재생 — 반복 엔진이 부른다
     한영 모드에서는 '한국어 → 주력 언어' 가 한 회차다. */
  function repeatUnitPlay(u) {
    return function (opts) {
      var code = state.lang;
      var d = u.t && u.t[code];
      if (!d) {
        if (opts.onerror) { opts.onerror(); }
        return;
      }
      speakLangPair({
        koUrl: koUnitClip(u),
        koText: u.ko,
        text: sayOf(d),
        code: code,
        url: unitClip(u, code),
        rate: state.speed,
        onend: opts.onend,
        onerror: opts.onerror
      });
    };
  }

  function introBackUnit(u, idx, L) {
    var d = u.t[L.code];
    var li = el('li', { class: 'turn back-turn intro-back-unit', 'data-unit': u.id, 'data-kind': u.kind, 'data-side': 'back' });
    li.appendChild(el('div', { class: 'turn-head' }, [
      el('span', { class: 'badge kind-' + u.kind, text: u.kindLabel }),
      el('span', { class: 'turn-no', text: (idx + 1) + '.' })
    ]));
    li.appendChild(el('p', { class: 'en orig', lang: L.tts, text: d.text }));
    li.appendChild(el('p', { class: 'pron-line' }, [
      el('span', { class: 'pron-lbl', text: '발음 ' }),
      el('b', { class: 'pron-bold', text: d.pron })
    ]));
    if (d.aux) { li.appendChild(el('p', { class: 'aux-line', text: d.aux })); }
    li.appendChild(el('p', { class: 'ko-sub', text: introKoText(u) }));
    if (d.ex) {
      li.appendChild(el('div', { class: 'mini-ex' }, [
        el('p', { class: 'mini-ex-text', lang: L.tts, text: d.ex }),
        el('p', { class: 'mini-ex-pron' }, [el('span', { text: '발음 ' }), el('b', { text: d.exPron || '' })]),
        d.exKo ? el('p', { class: 'mini-ex-ko', text: d.exKo }) : null
      ]));
    }
    if (d.tip) { li.appendChild(el('p', { class: 'unit-tip', text: d.tip })); }

    var acts = el('div', { class: 'acts' });
    var sayRate = el('span', { class: 'say-rate', text: speedLabel(state.speed) });
    var say = el('button', {
      class: 'btn small btn-say',
      type: 'button',
      'data-say-unit': u.id,
      'aria-label': introKoText(u) + ' ' + L.name + '로 듣기'
    }, [el('span', { class: 'say-ico', 'aria-hidden': 'true', text: '🔊' }), sayRate]);
    press(say, function () { speakUnit(u, L.code, state.speed, u.id); });
    acts.appendChild(say);
    li.appendChild(acts);
    return { node: li, rateSpan: sayRate };
  }

  function buildIntroCard(L) {
    cardRefs = { flip: null, front: null, back: null, playBtn: null, playLbl: null, stopBtn: null, rateTag: null, frontTurns: {}, backTurns: {}, rateBtns: [], backRateBtns: [], sayRates: [] };
    koEnRefs = [];
    miniRefs = {};

    var flip = el('div', { class: 'flip', id: 'flip' });
    var front = el('section', { class: 'face front', 'aria-label': '한국어 화면' });
    var back = el('section', { class: 'face back', 'aria-label': L.name + ' 화면' });

    /* 앞면 — 한국어 한 화면(5개국어 탭이 모두 같은 내용) */
    var toBack = press(el('button', { class: 'btn ghost small btn-flip', type: 'button', text: '↻ ' + L.name + ' 전체 보기' }), function () { setFlip(true); });
    front.appendChild(el('div', { class: 'face-head' }, [
      el('div', { class: 'face-title' }, [
        el('span', { class: 'face-flag', 'aria-hidden': 'true', text: '🇰🇷' }),
        el('div', {}, [el('b', { text: '한국어 → 5개국어' }), el('small', { text: '줄마다 국기 버튼을 누르면 발음과 소리가 바로 나와요' })])
      ]),
      el('div', { class: 'head-btns' }, [koEnToggle(), toBack])
    ]));

    var frontList = el('ol', { class: 'turns intro-units' });
    for (var i = 0; i < INTRO.units.length; i++) {
      frontList.appendChild(introFrontUnit(INTRO.units[i], i));
    }
    front.appendChild(frontList);
    front.appendChild(el('p', { class: 'tap-hint', text: '빈 곳을 탭하면 ' + L.name + ' 전체가 보여요' }));

    /* 뒷면 — 선택한 주력 언어 7단위 전체 */
    var playLbl = el('span', { class: 'play-lbl', text: '🔊 전체 듣기' });
    var rateTag = el('span', { class: 'rate-tag', text: speedLabel(state.speed) });
    var playBtn = el('button', { class: 'btn primary small btn-play-all', type: 'button' }, [playLbl, rateTag]);
    press(playBtn, function () { playAllIntro(); });
    var stopBtn = el('button', { class: 'btn small btn-stop', type: 'button', text: '⏹ 정지', hidden: true });
    press(stopBtn, function () { stopAll(); });
    var toFront = press(el('button', { class: 'btn ghost small btn-flip', type: 'button', text: '↻ 한국어로 돌아가기' }), function () { setFlip(false); });
    /* 전체 듣기 옆 전체 반복 3 · 5 · 7 — 7단위를 주력 언어로 한 회차 */
    var allRep = allRepeatRow(function () {
      var Ln = langDef(state.lang);
      return { items: INTRO.units, play: introPass(Ln) };
    });

    back.appendChild(el('div', { class: 'face-head' }, [
      el('div', { class: 'face-title' }, [
        el('span', { class: 'face-flag', 'aria-hidden': 'true', text: L.flag }),
        el('div', {}, [el('b', { text: L.name }), el('small', { text: '원문 · 한글 발음 · 표현 팁' })])
      ]),
      el('div', { class: 'head-btns' }, [playBtn, koEnToggle(), allRep, stopBtn, toFront])
    ]));

    /* 4단 속도 */
    var speedGroup = el('span', { class: 'spd-group', 'aria-label': '문장 배속' });
    for (var s = 0; s < SPEEDS_BACK.length; s++) {
      (function (sp) {
        var b = el('button', {
          class: 'spd spd-b' + (state.speed === sp.r ? ' is-on' : ''),
          type: 'button',
          'data-brate': String(sp.r),
          'aria-pressed': state.speed === sp.r ? 'true' : 'false',
          'aria-label': sp.label + ' 속도로 듣기',
          text: sp.label
        });
        press(b, function () {
          /* 배속을 바꾸면 진행 중인 전체 듣기·반복은 즉시 멈춘다 */
          stopAll();
          state.speed = sp.r;
          saveUI();
          syncSpeed();
          toast('속도 ' + speedLabel(sp.r));
        });
        cardRefs.backRateBtns.push(b);
        speedGroup.appendChild(b);
      })(SPEEDS_BACK[s]);
    }
    back.appendChild(el('div', { class: 'back-speed' }, [
      el('span', { class: 'seg-label', text: '속도' }),
      speedGroup
    ]));

    var backList = el('ol', { class: 'turns intro-back-units' });
    for (var j = 0; j < INTRO.units.length; j++) {
      var bu = introBackUnit(INTRO.units[j], j, L);
      backList.appendChild(bu.node);
      cardRefs.backTurns[INTRO.units[j].id] = bu.node;
      cardRefs.sayRates.push(bu.rateSpan);
    }
    back.appendChild(backList);
    back.appendChild(el('div', { class: 'card-foot' }, [
      el('p', { class: 'foot-note', text: '샘플 1세트 · 7단위 (단어 3 · 회화 3 · 문법 1)' })
    ]));

    flip.appendChild(front);
    flip.appendChild(back);
    flip.addEventListener('click', function (ev) {
      var t = ev && ev.target;
      if (t && t.closest) {
        if (t.closest('button') || t.closest('a') || t.closest('input') || t.closest('textarea') || t.closest('.hint-pill')) { return; }
      }
      setFlip(!state.flipped);
    });

    cardRefs.flip = flip;
    cardRefs.front = front;
    cardRefs.back = back;
    cardRefs.playBtn = playBtn;
    cardRefs.playLbl = playLbl;
    cardRefs.stopBtn = stopBtn;
    cardRefs.rateTag = rateTag;
    cardRefs.flipStage = el('div', { class: 'flip-stage' }, [flip]);
    return cardRefs.flipStage;
  }

  /* 주력 언어 7단위 전체를 한 회차로 — 5개국어 뒷면 전체 듣기·전체 반복
     한영 모드에서는 단위마다 '한국어 → 주력 언어' 를 한 바퀴 돈다. */
  function introPass(L) {
    return function (u, opts) {
      var d = u.t[L.code];
      highlight(u.id);
      speakLangPair({
        koUrl: koUnitClip(u),
        koText: u.ko,
        text: sayOf(d),
        code: L.code,
        url: unitClip(u, L.code),
        rate: state.speed,
        cancel: false,
        onend: opts.onend,
        onerror: opts.onerror
      });
    };
  }

  function playAllIntro() {
    var L = langDef(state.lang);
    startPlaySequence({ rounds: 1, items: INTRO.units, play: introPass(L) });
  }

  function selectScene(id) {
    state.sceneId = id;
    state.flipped = false;
    state.practice = null;
    state.quiz = null;
    state.hints = {};
    saveUI();
    renderStudy();
    updateBadge();
  }

  /* ════════════════════════════════════════════════════
     9. 혼자 연습 탭 — 영어 타이핑
     ════════════════════════════════════════════════════ */
  function practiceQueue(sc, scope, order) {
    var ids = [];
    for (var i = 0; i < sc.turns.length; i++) {
      if (scope === 'all' || sc.turns[i].speaker === 'me') { ids.push(sc.turns[i].id); }
    }
    if (order === 'rand') { return shuffle(ids); }
    return ids;
  }

  function startPractice(sc) {
    state.practice = {
      sceneId: sc.id,
      scope: state.practiceScope,
      order: state.practiceOrder,
      queue: practiceQueue(sc, state.practiceScope, state.practiceOrder),
      idx: 0,
      phase: 'input',
      results: [],
      done: false
    };
  }

  function seg(label, options, value, onPick) {
    var wrap = el('div', {});
    wrap.appendChild(el('span', { class: 'seg-label', text: label }));
    var row = el('div', { class: 'seg', role: 'group', 'aria-label': label });
    for (var i = 0; i < options.length; i++) {
      (function (o) {
        var on = o.v === value;
        var b = el('button', { class: 'btn' + (on ? ' act' : ''), type: 'button', 'aria-pressed': on ? 'true' : 'false', 'data-v': o.v, text: o.l });
        press(b, function () { if (!on) { onPick(o.v); } });
        row.appendChild(b);
      })(options[i]);
    }
    wrap.appendChild(row);
    return wrap;
  }

  function prevTurnOf(sc, turnId) {
    var i = turnIndex(sc, turnId);
    return i > 0 ? sc.turns[i - 1] : null;
  }

  function renderPractice() {
    var root = refs.practice;
    if (!root) { return; }
    var sc = currentScene();
    if (!state.practice || state.practice.sceneId !== sc.id) { startPractice(sc); }
    var p = state.practice;
    clear(root);

    root.appendChild(el('div', { class: 'view-head' }, [
      el('h1', { class: 'view-title', text: '✍️ 혼자 연습' }),
      el('p', { class: 'view-sub', text: sc.title + ' · 한국어를 보고 영어로 타이핑해 보세요' })
    ]));

    var tools = el('div', { class: 'panel soft' });
    var segRow = el('div', { class: 'seg-row' });
    segRow.appendChild(seg('범위', [{ v: 'me', l: '내 대사' }, { v: 'all', l: '전체 대사' }], p.scope, function (v) {
      state.practiceScope = v; saveUI(); startPractice(sc); renderPractice(); toast('범위를 ' + (v === 'all' ? '전체 대사' : '내 대사') + '로 바꿔 새로 시작했어요');
    }));
    segRow.appendChild(seg('순서', [{ v: 'seq', l: '순차' }, { v: 'rand', l: '랜덤' }], p.order, function (v) {
      state.practiceOrder = v; saveUI(); startPractice(sc); renderPractice(); toast((v === 'rand' ? '랜덤' : '순차') + ' 순서로 새로 시작했어요');
    }));
    tools.appendChild(segRow);
    root.appendChild(tools);

    if (p.done) { root.appendChild(practiceSummary(sc, p)); return; }
    if (!p.queue.length) {
      root.appendChild(el('div', { class: 'panel' }, [
